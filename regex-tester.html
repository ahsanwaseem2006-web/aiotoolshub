<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regex Tester - AIO Tools Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4ff, #e8e0ff, #fce4ff);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --bg-secondary: #fff;
            --success: #10b981;
            --danger: #ef4444;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0a0a1a, #1a1035, #0d1520);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #fff;
            --text-secondary: #b4b4d4;
            --nav-bg: rgba(10, 10, 26, 0.9);
            --bg-secondary: #12122a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        .main-content {
            padding: 100px 2rem 40px;
            max-width: 900px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            background: var(--accent-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }

        .tool-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .regex-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .regex-row span {
            font-size: 1.5rem;
            color: var(--text-secondary);
        }

        input {
            flex: 1;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: monospace;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .flags {
            display: flex;
            gap: 0.5rem;
        }

        .flag {
            padding: 14px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-family: monospace;
            color: var(--text-secondary);
            transition: all 0.3s;
        }

        .flag.active {
            background: var(--accent-gradient);
            border-color: transparent;
            color: white;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: inherit;
            resize: vertical;
            line-height: 1.7;
        }

        .status {
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        .status.valid {
            color: var(--success);
        }

        .status.invalid {
            color: var(--danger);
        }

        .result {
            background: var(--bg-secondary);
            border-radius: 14px;
            padding: 1.5rem;
        }

        .result h3 {
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .matches {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .match {
            padding: 8px 14px;
            background: rgba(124, 58, 237, 0.2);
            border-radius: 8px;
            font-family: monospace;
        }

        .highlighted {
            line-height: 1.8;
        }

        .highlighted mark {
            background: rgba(124, 58, 237, 0.3);
            padding: 2px 4px;
            border-radius: 3px;
            color: inherit;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
        <button class="theme-toggle" id="themeToggle">
            <div class="toggle-thumb"></div>
        </button>
    </nav>
    <main class="main-content">
        <a href="index.html" class="back-link">← Back to Tools</a>
        <div class="tool-header">
            <div class="tool-icon">🔍</div>
            <h1>Regex Tester</h1>
            <p>Test regular expressions in real-time</p>
        </div>
        <div class="tool-card">
            <div class="input-group">
                <label>Regular Expression</label>
                <div class="regex-row">
                    <span>/</span>
                    <input type="text" id="regex" value="\w+" placeholder="Enter regex pattern">
                    <span>/</span>
                    <div class="flags">
                        <button class="flag active" data-flag="g">g</button>
                        <button class="flag" data-flag="i">i</button>
                        <button class="flag" data-flag="m">m</button>
                    </div>
                </div>
                <div class="status" id="status"></div>
            </div>
            <div class="input-group">
                <label>Test String</label>
                <textarea
                    id="testString">Hello World! This is a test string with numbers 123 and special chars @#$.</textarea>
            </div>
            <div class="result">
                <h3>📋 Matches (<span id="matchCount">0</span>)</h3>
                <div class="matches" id="matches"></div>
                <h3 style="margin-top: 1.5rem;">🎨 Highlighted</h3>
                <div class="highlighted" id="highlighted"></div>
            </div>
        </div>
    </main>
    <script>
        document.getElementById('themeToggle').onclick = () => {
            const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = t; localStorage.setItem('theme', t);
        };
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';

        const flags = { g: true, i: false, m: false };
        document.querySelectorAll('.flag').forEach(btn => {
            btn.onclick = () => {
                btn.classList.toggle('active');
                flags[btn.dataset.flag] = btn.classList.contains('active');
                testRegex();
            };
        });

        const regexInput = document.getElementById('regex');
        const testString = document.getElementById('testString');
        const status = document.getElementById('status');
        const matchesDiv = document.getElementById('matches');
        const matchCount = document.getElementById('matchCount');
        const highlighted = document.getElementById('highlighted');

        function testRegex() {
            const pattern = regexInput.value;
            const text = testString.value;
            const flagStr = Object.entries(flags).filter(([, v]) => v).map(([k]) => k).join('');

            try {
                const regex = new RegExp(pattern, flagStr);
                status.textContent = '✓ Valid regex';
                status.className = 'status valid';

                const matches = [...text.matchAll(new RegExp(pattern, flagStr.includes('g') ? flagStr : flagStr + 'g'))];
                matchCount.textContent = matches.length;
                matchesDiv.innerHTML = matches.map(m => `<span class="match">${m[0]}</span>`).join('');

                // Highlight
                let result = text;
                if (pattern) {
                    result = text.replace(new RegExp(pattern, flagStr.includes('g') ? flagStr : flagStr + 'g'), '<mark>$&</mark>');
                }
                highlighted.innerHTML = result;
            } catch (e) {
                status.textContent = '✗ ' + e.message;
                status.className = 'status invalid';
                matchesDiv.innerHTML = '';
                matchCount.textContent = '0';
                highlighted.textContent = text;
            }
        }

        regexInput.oninput = testRegex;
        testString.oninput = testRegex;
        testRegex();
    </script>
</body>

</html>
