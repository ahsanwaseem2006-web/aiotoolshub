<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter - AIO Tools Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="description"
        content="Free Unit Converter - Convert length, weight, temperature, volume, and more units instantly.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script defer data-domain="aiotoolshub.com" src="https://plausible.io/js/script.js"></script>
    <style>
        :root {
            --bg-primary: #f0f4ff;
            --bg-secondary: #ffffff;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e8e0ff 50%, #fce4ff 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #7a7a9a;
            --accent-1: #7c3aed;
            --accent-2: #06b6d4;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
        }

        [data-theme="dark"] {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-gradient: linear-gradient(135deg, #0a0a1a 0%, #1a1035 50%, #0d1520 100%);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #b4b4d4;
            --text-muted: #7a7a9a;
            --accent-1: #a78bfa;
            --accent-2: #22d3ee;
            --accent-gradient: linear-gradient(135deg, #a78bfa, #22d3ee);
            --nav-bg: rgba(10, 10, 26, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
        }

        .bg-shape:nth-child(1) {
            width: 600px;
            height: 600px;
            background: var(--accent-1);
            top: -200px;
            right: -200px;
        }

        .bg-shape:nth-child(2) {
            width: 500px;
            height: 500px;
            background: var(--accent-2);
            bottom: -150px;
            left: -150px;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
            color: inherit;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-thumb::before {
            content: '🌙';
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 14px;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        [data-theme="light"] .toggle-thumb::before {
            content: '☀️';
        }

        .main-content {
            padding: 120px 2rem 60px;
            position: relative;
            z-index: 1;
        }

        .tool-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 2rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 80px;
            height: 80px;
            background: var(--accent-gradient);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
        }

        .tool-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
        }

        .category-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .category-tab {
            padding: 10px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
            font-family: inherit;
            color: var(--text-primary);
        }

        .category-tab:hover {
            border-color: var(--accent-1);
        }

        .category-tab.active {
            background: var(--accent-gradient);
            border-color: transparent;
            color: white;
        }

        .converter-box {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .input-row {
            display: flex;
            gap: 1rem;
        }

        input,
        select {
            flex: 1;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: inherit;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-1);
        }

        .swap-btn {
            width: 50px;
            height: 50px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            align-self: center;
            transition: transform 0.3s;
        }

        .swap-btn:hover {
            transform: rotate(180deg);
        }

        .result-display {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            word-break: break-all;
        }

        .result-unit {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .formula {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--glass-bg);
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .tool-header h1 {
                font-size: 2rem;
            }

            .input-row {
                flex-direction: column;
            }

            .result-value {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="bg-shapes">
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>
    </div>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
            <button class="theme-toggle" id="themeToggle">
                <div class="toggle-thumb"></div>
            </button>
        </div>
    </nav>
    <main class="main-content">
        <div class="tool-container">
            <a href="index.html" class="back-link">← Back to Tools</a>
            <div class="tool-header">
                <div class="tool-icon">📏</div>
                <h1>Unit Converter</h1>
                <p>Convert between different measurement units</p>
            </div>
            <div class="tool-card">
                <div class="category-tabs" id="categoryTabs">
                    <button class="category-tab active" data-category="length">📐 Length</button>
                    <button class="category-tab" data-category="weight">⚖️ Weight</button>
                    <button class="category-tab" data-category="temperature">🌡️ Temp</button>
                    <button class="category-tab" data-category="volume">🧪 Volume</button>
                    <button class="category-tab" data-category="area">📏 Area</button>
                    <button class="category-tab" data-category="speed">🚀 Speed</button>
                    <button class="category-tab" data-category="data">💾 Data</button>
                </div>
                <div class="converter-box">
                    <div class="input-group">
                        <label>From</label>
                        <div class="input-row">
                            <input type="number" id="inputValue" value="1" oninput="convert()">
                            <select id="fromUnit" onchange="convert()"></select>
                        </div>
                    </div>
                    <button class="swap-btn" onclick="swapUnits()">⇅</button>
                    <div class="input-group">
                        <label>To</label>
                        <div class="input-row">
                            <select id="toUnit" onchange="convert()"></select>
                        </div>
                    </div>
                    <div class="result-display">
                        <div class="result-value" id="resultValue">1</div>
                        <div class="result-unit" id="resultUnit">meter</div>
                        <div class="formula" id="formula">1 m = 1 m</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const setTheme = t => { document.documentElement.dataset.theme = t; localStorage.setItem('theme', t); };
        themeToggle.onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
        setTheme(localStorage.getItem('theme') || 'dark');

        const units = {
            length: { meter: 1, kilometer: 1000, centimeter: 0.01, millimeter: 0.001, mile: 1609.344, yard: 0.9144, foot: 0.3048, inch: 0.0254 },
            weight: { kilogram: 1, gram: 0.001, milligram: 0.000001, pound: 0.453592, ounce: 0.0283495, ton: 1000 },
            temperature: { celsius: 'c', fahrenheit: 'f', kelvin: 'k' },
            volume: { liter: 1, milliliter: 0.001, gallon: 3.78541, quart: 0.946353, cup: 0.236588, fluidounce: 0.0295735 },
            area: { sqmeter: 1, sqkilometer: 1000000, sqmile: 2589988.11, sqyard: 0.836127, sqfoot: 0.092903, acre: 4046.86, hectare: 10000 },
            speed: { mps: 1, kmph: 0.277778, mph: 0.44704, knot: 0.514444 },
            data: { byte: 1, kilobyte: 1024, megabyte: 1048576, gigabyte: 1073741824, terabyte: 1099511627776 }
        };

        const unitNames = {
            meter: 'Meter', kilometer: 'Kilometer', centimeter: 'Centimeter', millimeter: 'Millimeter', mile: 'Mile', yard: 'Yard', foot: 'Foot', inch: 'Inch',
            kilogram: 'Kilogram', gram: 'Gram', milligram: 'Milligram', pound: 'Pound', ounce: 'Ounce', ton: 'Metric Ton',
            celsius: 'Celsius', fahrenheit: 'Fahrenheit', kelvin: 'Kelvin',
            liter: 'Liter', milliliter: 'Milliliter', gallon: 'Gallon (US)', quart: 'Quart', cup: 'Cup', fluidounce: 'Fluid Ounce',
            sqmeter: 'Square Meter', sqkilometer: 'Square Kilometer', sqmile: 'Square Mile', sqyard: 'Square Yard', sqfoot: 'Square Foot', acre: 'Acre', hectare: 'Hectare',
            mps: 'Meters/Second', kmph: 'Kilometers/Hour', mph: 'Miles/Hour', knot: 'Knot',
            byte: 'Byte', kilobyte: 'Kilobyte', megabyte: 'Megabyte', gigabyte: 'Gigabyte', terabyte: 'Terabyte'
        };

        let currentCategory = 'length';

        document.querySelectorAll('.category-tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.dataset.category;
                populateUnits();
                convert();
            };
        });

        function populateUnits() {
            const fromSelect = document.getElementById('fromUnit');
            const toSelect = document.getElementById('toUnit');
            const categoryUnits = Object.keys(units[currentCategory]);

            fromSelect.innerHTML = categoryUnits.map((u, i) => `<option value="${u}" ${i === 0 ? 'selected' : ''}>${unitNames[u]}</option>`).join('');
            toSelect.innerHTML = categoryUnits.map((u, i) => `<option value="${u}" ${i === 1 ? 'selected' : ''}>${unitNames[u]}</option>`).join('');
        }

        function convert() {
            const value = parseFloat(document.getElementById('inputValue').value) || 0;
            const from = document.getElementById('fromUnit').value;
            const to = document.getElementById('toUnit').value;
            let result;

            if (currentCategory === 'temperature') {
                result = convertTemp(value, from, to);
            } else {
                const baseValue = value * units[currentCategory][from];
                result = baseValue / units[currentCategory][to];
            }

            const formatted = result.toLocaleString('en-US', { maximumFractionDigits: 10 });
            document.getElementById('resultValue').textContent = formatted;
            document.getElementById('resultUnit').textContent = unitNames[to];
            document.getElementById('formula').textContent = `${value} ${unitNames[from]} = ${formatted} ${unitNames[to]}`;
        }

        function convertTemp(value, from, to) {
            let celsius;
            if (from === 'celsius') celsius = value;
            else if (from === 'fahrenheit') celsius = (value - 32) * 5 / 9;
            else celsius = value - 273.15;

            if (to === 'celsius') return celsius;
            else if (to === 'fahrenheit') return celsius * 9 / 5 + 32;
            else return celsius + 273.15;
        }

        function swapUnits() {
            const from = document.getElementById('fromUnit');
            const to = document.getElementById('toUnit');
            [from.value, to.value] = [to.value, from.value];
            convert();
        }

        populateUnits();
        convert();
    </script>
</body>

</html>
