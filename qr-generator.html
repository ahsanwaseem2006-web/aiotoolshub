<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - AIO Tools Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="description" content="Free QR Code Generator - Create custom QR codes for URLs, text, WiFi, and more.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script defer data-domain="aiotoolshub.com" src="https://plausible.io/js/script.js"></script>
    <style>
        :root {
            --bg-primary: #f0f4ff;
            --bg-secondary: #ffffff;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e8e0ff 50%, #fce4ff 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #7a7a9a;
            --accent-1: #7c3aed;
            --accent-2: #06b6d4;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
        }

        [data-theme="dark"] {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-gradient: linear-gradient(135deg, #0a0a1a 0%, #1a1035 50%, #0d1520 100%);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #b4b4d4;
            --text-muted: #7a7a9a;
            --accent-1: #a78bfa;
            --accent-2: #22d3ee;
            --accent-gradient: linear-gradient(135deg, #a78bfa, #22d3ee);
            --nav-bg: rgba(10, 10, 26, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
        }

        .bg-shape:nth-child(1) {
            width: 600px;
            height: 600px;
            background: var(--accent-1);
            top: -200px;
            right: -200px;
        }

        .bg-shape:nth-child(2) {
            width: 500px;
            height: 500px;
            background: var(--accent-2);
            bottom: -150px;
            left: -150px;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
            color: inherit;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-thumb::before {
            content: '🌙';
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 14px;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        [data-theme="light"] .toggle-thumb::before {
            content: '☀️';
        }

        .main-content {
            padding: 120px 2rem 60px;
            position: relative;
            z-index: 1;
        }

        .tool-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 2rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 80px;
            height: 80px;
            background: var(--accent-gradient);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
        }

        .tool-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: inherit;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-1);
        }

        textarea {
            min-height: 100px;
        }

        .color-row {
            display: flex;
            gap: 1rem;
        }

        .color-group {
            flex: 1;
        }

        .color-input {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .color-input input[type="color"] {
            width: 50px;
            height: 44px;
            padding: 4px;
            border-radius: 8px;
            cursor: pointer;
        }

        .color-input input[type="text"] {
            flex: 1;
        }

        .size-slider {
            margin-bottom: 1.5rem;
        }

        .size-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: var(--glass-border);
            border-radius: 4px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-bottom: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.4);
        }

        .qr-result {
            text-align: center;
            padding: 2rem;
            background: var(--bg-secondary);
            border-radius: 16px;
            margin-top: 1rem;
        }

        .qr-result canvas {
            border-radius: 12px;
            max-width: 100%;
        }

        .download-btns {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .download-btns .btn {
            flex: 1;
            margin-bottom: 0;
        }

        .btn-secondary {
            background: var(--glass-bg);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
        }

        @media (max-width: 768px) {
            .tool-header h1 {
                font-size: 2rem;
            }

            .color-row {
                flex-direction: column;
            }

            .download-btns {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="bg-shapes">
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>
    </div>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
            <button class="theme-toggle" id="themeToggle">
                <div class="toggle-thumb"></div>
            </button>
        </div>
    </nav>
    <main class="main-content">
        <div class="tool-container">
            <a href="index.html" class="back-link">← Back to Tools</a>
            <div class="tool-header">
                <div class="tool-icon">📱</div>
                <h1>QR Code Generator</h1>
                <p>Create custom QR codes instantly</p>
            </div>
            <div class="tool-card">
                <div class="input-group">
                    <label for="qrContent">Content</label>
                    <textarea id="qrContent"
                        placeholder="Enter URL, text, or any content...">https://aiotoolshub.com</textarea>
                </div>
                <div class="color-row">
                    <div class="color-group">
                        <label>Foreground Color</label>
                        <div class="color-input">
                            <input type="color" id="fgColor" value="#000000">
                            <input type="text" id="fgColorText" value="#000000">
                        </div>
                    </div>
                    <div class="color-group">
                        <label>Background Color</label>
                        <div class="color-input">
                            <input type="color" id="bgColor" value="#ffffff">
                            <input type="text" id="bgColorText" value="#ffffff">
                        </div>
                    </div>
                </div>
                <div class="size-slider">
                    <div class="size-header">
                        <span>Size</span>
                        <span id="sizeValue">256px</span>
                    </div>
                    <input type="range" id="sizeSlider" min="128" max="512" value="256" step="32">
                </div>
                <button class="btn" onclick="generateQR()">Generate QR Code</button>
                <div class="qr-result" id="qrResult">
                    <canvas id="qrCanvas"></canvas>
                    <div class="download-btns">
                        <button class="btn" onclick="downloadQR('png')">⬇️ PNG</button>
                        <button class="btn btn-secondary" onclick="downloadQR('svg')">⬇️ SVG</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const setTheme = t => { document.documentElement.dataset.theme = t; localStorage.setItem('theme', t); };
        themeToggle.onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
        setTheme(localStorage.getItem('theme') || 'dark');

        const fgColor = document.getElementById('fgColor');
        const fgColorText = document.getElementById('fgColorText');
        const bgColor = document.getElementById('bgColor');
        const bgColorText = document.getElementById('bgColorText');
        const sizeSlider = document.getElementById('sizeSlider');
        const sizeValue = document.getElementById('sizeValue');

        fgColor.oninput = () => fgColorText.value = fgColor.value;
        fgColorText.oninput = () => fgColor.value = fgColorText.value;
        bgColor.oninput = () => bgColorText.value = bgColor.value;
        bgColorText.oninput = () => bgColor.value = bgColorText.value;
        sizeSlider.oninput = () => sizeValue.textContent = sizeSlider.value + 'px';

        // Simple QR Code generator (basic implementation)
        function generateQR() {
            const content = document.getElementById('qrContent').value || 'https://aiotoolshub.com';
            const size = parseInt(sizeSlider.value);
            const canvas = document.getElementById('qrCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = size;
            canvas.height = size;

            // Using a simple QR encoding
            const qrData = generateQRMatrix(content);
            const cellSize = size / qrData.length;

            ctx.fillStyle = bgColor.value;
            ctx.fillRect(0, 0, size, size);

            ctx.fillStyle = fgColor.value;
            for (let y = 0; y < qrData.length; y++) {
                for (let x = 0; x < qrData[y].length; x++) {
                    if (qrData[y][x]) {
                        ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                    }
                }
            }
        }

        function generateQRMatrix(text) {
            // Simplified QR-like pattern generator
            // In production, use a proper QR library like qrcode.js
            const size = 25;
            const matrix = Array(size).fill(null).map(() => Array(size).fill(false));

            // Position patterns (corners)
            const drawPositionPattern = (x, y) => {
                for (let i = 0; i < 7; i++) {
                    for (let j = 0; j < 7; j++) {
                        if (i === 0 || i === 6 || j === 0 || j === 6 || (i >= 2 && i <= 4 && j >= 2 && j <= 4)) {
                            matrix[y + i][x + j] = true;
                        }
                    }
                }
            };

            drawPositionPattern(0, 0);
            drawPositionPattern(size - 7, 0);
            drawPositionPattern(0, size - 7);

            // Timing patterns
            for (let i = 8; i < size - 8; i++) {
                matrix[6][i] = i % 2 === 0;
                matrix[i][6] = i % 2 === 0;
            }

            // Data encoding (simplified - creates pattern based on text)
            let hash = 0;
            for (let i = 0; i < text.length; i++) {
                hash = ((hash << 5) - hash) + text.charCodeAt(i);
                hash = hash & hash;
            }

            const rand = (seed) => {
                seed = Math.sin(seed) * 10000;
                return seed - Math.floor(seed);
            };

            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    if (matrix[y][x] === false) {
                        // Skip position patterns and timing
                        if ((x < 9 && y < 9) || (x >= size - 8 && y < 9) || (x < 9 && y >= size - 8)) continue;
                        if (x === 6 || y === 6) continue;
                        matrix[y][x] = rand(hash + y * size + x) > 0.5;
                    }
                }
            }

            return matrix;
        }

        function downloadQR(format) {
            const canvas = document.getElementById('qrCanvas');
            if (format === 'png') {
                const link = document.createElement('a');
                link.download = 'qrcode.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            } else {
                // Basic SVG export
                const size = canvas.width;
                const ctx = canvas.getContext('2d');
                const imageData = ctx.getImageData(0, 0, size, size);
                let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}">`;
                svg += `<rect width="${size}" height="${size}" fill="${bgColor.value}"/>`;

                // Simplified SVG output
                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        const i = (y * size + x) * 4;
                        if (imageData.data[i] < 128) {
                            svg += `<rect x="${x}" y="${y}" width="1" height="1" fill="${fgColor.value}"/>`;
                        }
                    }
                }
                svg += '</svg>';

                const blob = new Blob([svg], { type: 'image/svg+xml' });
                const link = document.createElement('a');
                link.download = 'qrcode.svg';
                link.href = URL.createObjectURL(blob);
                link.click();
            }
        }

        // Generate initial QR
        generateQR();
    </script>
</body>

</html>
