<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UUID Generator - AIO Tools Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4ff, #e8e0ff, #fce4ff);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --bg-secondary: #fff;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0a0a1a, #1a1035, #0d1520);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #fff;
            --text-secondary: #b4b4d4;
            --nav-bg: rgba(10, 10, 26, 0.9);
            --bg-secondary: #12122a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        .main-content {
            padding: 100px 2rem 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            background: var(--accent-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }

        .tool-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
        }

        .options {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .option {
            flex: 1;
        }

        .option label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        select,
        input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: inherit;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            margin-bottom: 1.5rem;
        }

        .uuids-container {
            background: var(--bg-secondary);
            border-radius: 14px;
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .uuid-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            background: var(--glass-bg);
            font-family: monospace;
            font-size: 0.9rem;
        }

        .uuid-item:last-child {
            margin-bottom: 0;
        }

        .copy-single {
            padding: 6px 12px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            font-family: inherit;
            color: var(--text-primary);
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
        <button class="theme-toggle" id="themeToggle">
            <div class="toggle-thumb"></div>
        </button>
    </nav>
    <main class="main-content">
        <a href="index.html" class="back-link">← Back to Tools</a>
        <div class="tool-header">
            <div class="tool-icon">🆔</div>
            <h1>UUID Generator</h1>
            <p>Generate unique identifiers</p>
        </div>
        <div class="tool-card">
            <div class="options">
                <div class="option"><label>Version</label><select id="version">
                        <option value="4">UUID v4 (Random)</option>
                        <option value="1">UUID v1 (Timestamp)</option>
                    </select></div>
                <div class="option"><label>Count</label><input type="number" id="count" value="5" min="1" max="100">
                </div>
            </div>
            <button class="btn" onclick="generate()">Generate UUIDs</button>
            <div class="uuids-container" id="uuids"></div>
            <div class="actions">
                <button class="action-btn" onclick="copyAll()">📋 Copy All</button>
                <button class="action-btn" onclick="clearAll()">🗑️ Clear</button>
            </div>
        </div>
    </main>
    <script>
        document.getElementById('themeToggle').onclick = () => {
            const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = t; localStorage.setItem('theme', t);
        };
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';

        function uuidv4() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
        }

        function uuidv1() {
            const now = Date.now();
            return 'xxxxxxxx-xxxx-1xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c, i) => {
                const r = (now + Math.random() * 16) % 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
        }

        let generatedUuids = [];

        function generate() {
            const version = document.getElementById('version').value;
            const count = Math.min(parseInt(document.getElementById('count').value) || 1, 100);
            generatedUuids = [];

            for (let i = 0; i < count; i++) {
                generatedUuids.push(version === '4' ? uuidv4() : uuidv1());
            }

            document.getElementById('uuids').innerHTML = generatedUuids.map((uuid, i) =>
                `<div class="uuid-item"><span>${uuid}</span><button class="copy-single" onclick="copyOne(${i})">Copy</button></div>`
            ).join('');
        }

        function copyOne(i) {
            navigator.clipboard.writeText(generatedUuids[i]);
            event.target.textContent = '✓';
            setTimeout(() => event.target.textContent = 'Copy', 1000);
        }

        function copyAll() {
            navigator.clipboard.writeText(generatedUuids.join('\n'));
            event.target.textContent = '✓ Copied!';
            setTimeout(() => event.target.textContent = '📋 Copy All', 1500);
        }

        function clearAll() {
            generatedUuids = [];
            document.getElementById('uuids').innerHTML = '';
        }

        generate();
    </script>
</body>

</html>
