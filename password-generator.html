<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - AIO Tools Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="description"
        content="Free Password Generator - Create strong, secure passwords instantly with customizable options.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script defer data-domain="aiotoolshub.com" src="https://plausible.io/js/script.js"></script>
    <style>
        :root {
            --bg-primary: #f0f4ff;
            --bg-secondary: #ffffff;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e8e0ff 50%, #fce4ff 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #7a7a9a;
            --accent-1: #7c3aed;
            --accent-2: #06b6d4;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        [data-theme="dark"] {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-gradient: linear-gradient(135deg, #0a0a1a 0%, #1a1035 50%, #0d1520 100%);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #b4b4d4;
            --text-muted: #7a7a9a;
            --accent-1: #a78bfa;
            --accent-2: #22d3ee;
            --accent-gradient: linear-gradient(135deg, #a78bfa, #22d3ee);
            --nav-bg: rgba(10, 10, 26, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 20s ease-in-out infinite;
        }

        .bg-shape:nth-child(1) {
            width: 600px;
            height: 600px;
            background: var(--accent-1);
            top: -200px;
            right: -200px;
        }

        .bg-shape:nth-child(2) {
            width: 500px;
            height: 500px;
            background: var(--accent-2);
            bottom: -150px;
            left: -150px;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-20px, 20px);
            }
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
            color: inherit;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .toggle-thumb::before {
            content: '🌙';
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        [data-theme="light"] .toggle-thumb::before {
            content: '☀️';
        }

        .main-content {
            padding: 120px 2rem 60px;
            position: relative;
            z-index: 1;
        }

        .tool-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 2rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 80px;
            height: 80px;
            background: var(--accent-gradient);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
        }

        .tool-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
        }

        .password-display {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .password-text {
            flex: 1;
            font-family: 'Courier New', monospace;
            font-size: 1.25rem;
            font-weight: 600;
            word-break: break-all;
            min-height: 30px;
        }

        .copy-btn {
            background: var(--accent-gradient);
            border: none;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: transform 0.2s;
        }

        .copy-btn:hover {
            transform: scale(1.1);
        }

        .strength-bar {
            height: 6px;
            background: var(--glass-border);
            border-radius: 3px;
            margin-bottom: 0.5rem;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s, background 0.3s;
        }

        .strength-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .options-section {
            margin-bottom: 1.5rem;
        }

        .options-section h3 {
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .length-control {
            margin-bottom: 1.5rem;
        }

        .length-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .length-value {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            font-size: 1.25rem;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: var(--glass-border);
            border-radius: 4px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            cursor: pointer;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkbox-item:hover {
            background: rgba(124, 58, 237, 0.1);
        }

        .checkbox-item input {
            width: 20px;
            height: 20px;
            accent-color: var(--accent-1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.4);
        }

        .copied-toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--success);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            transition: transform 0.3s;
            z-index: 1001;
        }

        .copied-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .tool-header h1 {
                font-size: 2rem;
            }

            .checkbox-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="bg-shapes">
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>
    </div>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#tools">Tools</a></li>
            </ul>
            <button class="theme-toggle" id="themeToggle">
                <div class="toggle-thumb"></div>
            </button>
        </div>
    </nav>
    <main class="main-content">
        <div class="tool-container">
            <a href="index.html" class="back-link">← Back to Tools</a>
            <div class="tool-header">
                <div class="tool-icon">🔑</div>
                <h1>Password Generator</h1>
                <p>Generate strong, secure passwords instantly</p>
            </div>
            <div class="tool-card">
                <div class="password-display">
                    <div class="password-text" id="password">Click Generate!</div>
                    <button class="copy-btn" onclick="copyPassword()" title="Copy">📋</button>
                </div>
                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
                <div class="strength-text" id="strengthText">Password Strength: -</div>
                <div class="options-section">
                    <div class="length-control">
                        <div class="length-header">
                            <span>Password Length</span>
                            <span class="length-value" id="lengthValue">16</span>
                        </div>
                        <input type="range" id="lengthSlider" min="4" max="64" value="16" oninput="updateLength()">
                    </div>
                    <h3>Include Characters</h3>
                    <div class="checkbox-grid">
                        <label class="checkbox-item"><input type="checkbox" id="uppercase" checked><span>Uppercase
                                (A-Z)</span></label>
                        <label class="checkbox-item"><input type="checkbox" id="lowercase" checked><span>Lowercase
                                (a-z)</span></label>
                        <label class="checkbox-item"><input type="checkbox" id="numbers" checked><span>Numbers
                                (0-9)</span></label>
                        <label class="checkbox-item"><input type="checkbox" id="symbols" checked><span>Symbols
                                (!@#$)</span></label>
                    </div>
                </div>
                <button class="btn" onclick="generatePassword()">🔄 Generate Password</button>
            </div>
        </div>
    </main>
    <div class="copied-toast" id="toast">✓ Copied to clipboard!</div>
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const setTheme = t => { document.documentElement.dataset.theme = t; localStorage.setItem('theme', t); };
        themeToggle.onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
        setTheme(localStorage.getItem('theme') || 'dark');

        const chars = { upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', lower: 'abcdefghijklmnopqrstuvwxyz', nums: '0123456789', syms: '!@#$%^&*()_+-=[]{}|;:,.<>?' };

        function updateLength() { document.getElementById('lengthValue').textContent = document.getElementById('lengthSlider').value; }

        function generatePassword() {
            const length = parseInt(document.getElementById('lengthSlider').value);
            let charset = '';
            if (document.getElementById('uppercase').checked) charset += chars.upper;
            if (document.getElementById('lowercase').checked) charset += chars.lower;
            if (document.getElementById('numbers').checked) charset += chars.nums;
            if (document.getElementById('symbols').checked) charset += chars.syms;
            if (!charset) { alert('Please select at least one character type'); return; }
            let password = '';
            const array = new Uint32Array(length);
            crypto.getRandomValues(array);
            for (let i = 0; i < length; i++) password += charset[array[i] % charset.length];
            document.getElementById('password').textContent = password;
            updateStrength(password);
        }

        function updateStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (password.length >= 16) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');
            const levels = [
                { width: '15%', color: '#ef4444', label: 'Very Weak' },
                { width: '30%', color: '#f59e0b', label: 'Weak' },
                { width: '50%', color: '#eab308', label: 'Fair' },
                { width: '70%', color: '#22c55e', label: 'Good' },
                { width: '85%', color: '#10b981', label: 'Strong' },
                { width: '100%', color: '#059669', label: 'Very Strong' }
            ];
            const level = Math.min(Math.floor(strength / 1.2), 5);
            fill.style.width = levels[level].width;
            fill.style.background = levels[level].color;
            text.textContent = `Password Strength: ${levels[level].label}`;
        }

        function copyPassword() {
            const password = document.getElementById('password').textContent;
            if (password === 'Click Generate!') return;
            navigator.clipboard.writeText(password);
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        generatePassword();
    </script>
</body>

</html>
