<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Format Converter - AIO Tools Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="description"
        content="Free Image Format Converter - Convert images between JPG, PNG, WEBP, GIF formats instantly.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script defer data-domain="aiotoolshub.com" src="https://plausible.io/js/script.js"></script>
    <style>
        :root {
            --bg-primary: #f0f4ff;
            --bg-secondary: #ffffff;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e8e0ff 50%, #fce4ff 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #7a7a9a;
            --accent-1: #7c3aed;
            --accent-2: #06b6d4;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
        }

        [data-theme="dark"] {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-gradient: linear-gradient(135deg, #0a0a1a 0%, #1a1035 50%, #0d1520 100%);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #b4b4d4;
            --text-muted: #7a7a9a;
            --accent-1: #a78bfa;
            --accent-2: #22d3ee;
            --accent-gradient: linear-gradient(135deg, #a78bfa, #22d3ee);
            --nav-bg: rgba(10, 10, 26, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
        }

        .bg-shape:nth-child(1) {
            width: 600px;
            height: 600px;
            background: var(--accent-1);
            top: -200px;
            right: -200px;
        }

        .bg-shape:nth-child(2) {
            width: 500px;
            height: 500px;
            background: var(--accent-2);
            bottom: -150px;
            left: -150px;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
            color: inherit;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-thumb::before {
            content: '🌙';
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 14px;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        [data-theme="light"] .toggle-thumb::before {
            content: '☀️';
        }

        .main-content {
            padding: 120px 2rem 60px;
            position: relative;
            z-index: 1;
        }

        .tool-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 2rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 80px;
            height: 80px;
            background: var(--accent-gradient);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
        }

        .tool-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
        }

        .upload-zone {
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1.5rem;
        }

        .upload-zone:hover {
            border-color: var(--accent-1);
        }

        .upload-zone .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        #fileInput {
            display: none;
        }

        .preview-section {
            display: none;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .preview-section.show {
            display: block;
        }

        .preview-image {
            max-width: 100%;
            max-height: 250px;
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        .file-info {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .format-section {
            margin-bottom: 1.5rem;
        }

        .format-section label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .format-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .format-btn {
            padding: 1rem;
            background: var(--bg-secondary);
            border: 2px solid var(--glass-border);
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            font-family: inherit;
        }

        .format-btn:hover {
            border-color: var(--accent-1);
        }

        .format-btn.active {
            border-color: var(--accent-1);
            background: rgba(124, 58, 237, 0.1);
        }

        .format-btn .format-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .format-btn .format-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .quality-section {
            margin-bottom: 1.5rem;
        }

        .quality-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            appearance: none;
            -webkit-appearance: none;
            background: var(--glass-border);
            border-radius: 4px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .result-section {
            display: none;
            margin-top: 2rem;
            padding: 2rem;
            background: var(--bg-secondary);
            border-radius: 16px;
            text-align: center;
        }

        .result-section.show {
            display: block;
        }

        .result-image {
            max-width: 100%;
            max-height: 250px;
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .tool-header h1 {
                font-size: 2rem;
            }

            .format-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="bg-shapes">
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>
    </div>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
            <button class="theme-toggle" id="themeToggle">
                <div class="toggle-thumb"></div>
            </button>
        </div>
    </nav>
    <main class="main-content">
        <div class="tool-container">
            <a href="index.html" class="back-link">← Back to Tools</a>
            <div class="tool-header">
                <div class="tool-icon">🔄</div>
                <h1>Image Format Converter</h1>
                <p>Convert images between different formats instantly</p>
            </div>
            <div class="tool-card">
                <div class="upload-zone" id="uploadZone">
                    <div class="icon">📁</div>
                    <h3>Drop your image here</h3>
                    <p>or click to browse</p>
                    <input type="file" id="fileInput" accept="image/*">
                </div>
                <div class="preview-section" id="previewSection">
                    <img id="previewImage" class="preview-image" alt="Preview">
                    <div class="file-info" id="fileInfo"></div>
                </div>
                <div class="format-section">
                    <label>Convert to:</label>
                    <div class="format-grid">
                        <button class="format-btn active" data-format="image/png">
                            <div class="format-name">PNG</div>
                            <div class="format-desc">Lossless</div>
                        </button>
                        <button class="format-btn" data-format="image/jpeg">
                            <div class="format-name">JPG</div>
                            <div class="format-desc">Compressed</div>
                        </button>
                        <button class="format-btn" data-format="image/webp">
                            <div class="format-name">WEBP</div>
                            <div class="format-desc">Modern</div>
                        </button>
                        <button class="format-btn" data-format="image/gif">
                            <div class="format-name">GIF</div>
                            <div class="format-desc">Animated</div>
                        </button>
                    </div>
                </div>
                <div class="quality-section" id="qualitySection">
                    <div class="quality-header">
                        <span>Quality</span>
                        <span id="qualityValue">92%</span>
                    </div>
                    <input type="range" id="qualitySlider" min="10" max="100" value="92">
                </div>
                <button class="btn" id="convertBtn" disabled>Convert Image</button>
                <div class="result-section" id="resultSection">
                    <img id="resultImage" class="result-image" alt="Converted">
                    <p class="file-info" id="resultInfo"></p>
                    <button class="btn" id="downloadBtn">⬇️ Download</button>
                </div>
            </div>
        </div>
    </main>
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const setTheme = t => { document.documentElement.dataset.theme = t; localStorage.setItem('theme', t); };
        themeToggle.onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
        setTheme(localStorage.getItem('theme') || 'dark');

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const previewImage = document.getElementById('previewImage');
        const convertBtn = document.getElementById('convertBtn');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityValue = document.getElementById('qualityValue');
        const resultSection = document.getElementById('resultSection');
        const resultImage = document.getElementById('resultImage');
        const downloadBtn = document.getElementById('downloadBtn');
        const formatBtns = document.querySelectorAll('.format-btn');

        let currentImage = null;
        let selectedFormat = 'image/png';

        uploadZone.onclick = () => fileInput.click();
        uploadZone.ondragover = e => e.preventDefault();
        uploadZone.ondrop = e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); };
        fileInput.onchange = e => handleFile(e.target.files[0]);

        qualitySlider.oninput = () => qualityValue.textContent = qualitySlider.value + '%';

        formatBtns.forEach(btn => {
            btn.onclick = () => {
                formatBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedFormat = btn.dataset.format;
            };
        });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    previewImage.src = e.target.result;
                    previewSection.classList.add('show');
                    document.getElementById('fileInfo').textContent = `${file.name} • ${img.width}×${img.height} • ${(file.size / 1024).toFixed(1)}KB`;
                    convertBtn.disabled = false;
                    resultSection.classList.remove('show');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        convertBtn.onclick = () => {
            if (!currentImage) return;
            const canvas = document.createElement('canvas');
            canvas.width = currentImage.width;
            canvas.height = currentImage.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(currentImage, 0, 0);
            const quality = qualitySlider.value / 100;
            const dataUrl = canvas.toDataURL(selectedFormat, quality);
            resultImage.src = dataUrl;
            const ext = selectedFormat.split('/')[1];
            const size = Math.round((dataUrl.length * 3) / 4 / 1024);
            document.getElementById('resultInfo').textContent = `Converted to ${ext.toUpperCase()} • ~${size}KB`;
            resultSection.classList.add('show');
            downloadBtn.onclick = () => {
                const link = document.createElement('a');
                link.download = `converted.${ext === 'jpeg' ? 'jpg' : ext}`;
                link.href = dataUrl;
                link.click();
            };
        };
    </script>
</body>

</html>
