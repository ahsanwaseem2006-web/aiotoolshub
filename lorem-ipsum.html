<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorem Ipsum Generator - AIO Tools Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4ff, #e8e0ff, #fce4ff);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --bg-secondary: #fff;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0a0a1a, #1a1035, #0d1520);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #fff;
            --text-secondary: #b4b4d4;
            --nav-bg: rgba(10, 10, 26, 0.9);
            --bg-secondary: #12122a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        .main-content {
            padding: 100px 2rem 40px;
            max-width: 800px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            background: var(--accent-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }

        .tool-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
        }

        .options {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .option {
            flex: 1;
            min-width: 120px;
        }

        .option label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        select,
        input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: inherit;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            margin-bottom: 1.5rem;
        }

        .output {
            background: var(--bg-secondary);
            border-radius: 14px;
            padding: 1.5rem;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.8;
            position: relative;
        }

        .output p {
            margin-bottom: 1rem;
        }

        .output p:last-child {
            margin-bottom: 0;
        }

        .copy-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 8px 16px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
        <button class="theme-toggle" id="themeToggle">
            <div class="toggle-thumb"></div>
        </button>
    </nav>
    <main class="main-content">
        <a href="index.html" class="back-link">← Back to Tools</a>
        <div class="tool-header">
            <div class="tool-icon">📜</div>
            <h1>Lorem Ipsum Generator</h1>
            <p>Generate placeholder text for your designs</p>
        </div>
        <div class="tool-card">
            <div class="options">
                <div class="option"><label>Type</label><select id="type">
                        <option value="paragraphs">Paragraphs</option>
                        <option value="sentences">Sentences</option>
                        <option value="words">Words</option>
                    </select></div>
                <div class="option"><label>Count</label><input type="number" id="count" value="3" min="1" max="100">
                </div>
                <div class="option"><label>Start with</label><select id="start">
                        <option value="lorem">Lorem ipsum...</option>
                        <option value="random">Random</option>
                    </select></div>
            </div>
            <button class="btn" onclick="generate()">Generate Text</button>
            <div class="output" id="output">
                <button class="copy-btn" onclick="copyText()">Copy</button>
            </div>
        </div>
    </main>
    <script>
        document.getElementById('themeToggle').onclick = () => {
            const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = t; localStorage.setItem('theme', t);
        };
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';

        const words = ['lorem', 'ipsum', 'dolor', 'sit', 'amet', 'consectetur', 'adipiscing', 'elit', 'sed', 'do', 'eiusmod', 'tempor', 'incididunt', 'ut', 'labore', 'et', 'dolore', 'magna', 'aliqua', 'enim', 'ad', 'minim', 'veniam', 'quis', 'nostrud', 'exercitation', 'ullamco', 'laboris', 'nisi', 'aliquip', 'ex', 'ea', 'commodo', 'consequat', 'duis', 'aute', 'irure', 'in', 'reprehenderit', 'voluptate', 'velit', 'esse', 'cillum', 'fugiat', 'nulla', 'pariatur', 'excepteur', 'sint', 'occaecat', 'cupidatat', 'non', 'proident', 'sunt', 'culpa', 'qui', 'officia', 'deserunt', 'mollit', 'anim', 'id', 'est', 'laborum'];

        function randomWord() { return words[Math.floor(Math.random() * words.length)]; }

        function generateSentence(startWithLorem = false) {
            const len = 8 + Math.floor(Math.random() * 12);
            let sentence = startWithLorem ? 'Lorem ipsum dolor sit amet' : '';
            for (let i = startWithLorem ? 5 : 0; i < len; i++) {
                sentence += (i === 0 ? '' : ' ') + randomWord();
            }
            return sentence.charAt(0).toUpperCase() + sentence.slice(1) + '.';
        }

        function generateParagraph(startWithLorem = false) {
            const sentences = 4 + Math.floor(Math.random() * 4);
            let para = '';
            for (let i = 0; i < sentences; i++) {
                para += (i === 0 ? '' : ' ') + generateSentence(i === 0 && startWithLorem);
            }
            return para;
        }

        function generate() {
            const type = document.getElementById('type').value;
            const count = Math.min(parseInt(document.getElementById('count').value) || 1, 100);
            const startLorem = document.getElementById('start').value === 'lorem';
            let result = '';

            if (type === 'paragraphs') {
                for (let i = 0; i < count; i++) {
                    result += '<p>' + generateParagraph(i === 0 && startLorem) + '</p>';
                }
            } else if (type === 'sentences') {
                for (let i = 0; i < count; i++) {
                    result += generateSentence(i === 0 && startLorem) + ' ';
                }
                result = '<p>' + result.trim() + '</p>';
            } else {
                let wordList = startLorem ? 'Lorem ipsum ' : '';
                for (let i = startLorem ? 2 : 0; i < count; i++) {
                    wordList += randomWord() + ' ';
                }
                result = '<p>' + wordList.trim() + '</p>';
            }

            document.getElementById('output').innerHTML = '<button class="copy-btn" onclick="copyText()">Copy</button>' + result;
        }

        function copyText() {
            const text = document.getElementById('output').innerText.replace('Copy', '').trim();
            navigator.clipboard.writeText(text);
            event.target.textContent = 'Copied!';
            setTimeout(() => event.target.textContent = 'Copy', 1500);
        }

        generate();
    </script>
</body>

</html>
