<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter - AIO Tools Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="description"
        content="Free JSON Formatter & Validator - Beautify, validate, and minify JSON data with syntax highlighting.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code&display=swap"
        rel="stylesheet">
    <script defer data-domain="aiotoolshub.com" src="https://plausible.io/js/script.js"></script>
    <style>
        :root {
            --bg-primary: #f0f4ff;
            --bg-secondary: #ffffff;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e8e0ff 50%, #fce4ff 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #7a7a9a;
            --accent-1: #7c3aed;
            --accent-2: #06b6d4;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --success: #10b981;
            --danger: #ef4444;
            --json-key: #7c3aed;
            --json-string: #059669;
            --json-number: #0891b2;
            --json-bool: #dc2626;
        }

        [data-theme="dark"] {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-gradient: linear-gradient(135deg, #0a0a1a 0%, #1a1035 50%, #0d1520 100%);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #b4b4d4;
            --text-muted: #7a7a9a;
            --accent-1: #a78bfa;
            --accent-2: #22d3ee;
            --accent-gradient: linear-gradient(135deg, #a78bfa, #22d3ee);
            --nav-bg: rgba(10, 10, 26, 0.9);
            --json-key: #a78bfa;
            --json-string: #34d399;
            --json-number: #22d3ee;
            --json-bool: #fb7185;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
        }

        .bg-shape:nth-child(1) {
            width: 600px;
            height: 600px;
            background: var(--accent-1);
            top: -200px;
            right: -200px;
        }

        .bg-shape:nth-child(2) {
            width: 500px;
            height: 500px;
            background: var(--accent-2);
            bottom: -150px;
            left: -150px;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
            color: inherit;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-thumb::before {
            content: '🌙';
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 14px;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        [data-theme="light"] .toggle-thumb::before {
            content: '☀️';
        }

        .main-content {
            padding: 100px 2rem 60px;
            position: relative;
            z-index: 1;
        }

        .tool-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 1.5rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            background: var(--accent-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }

        .tool-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .editor-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .panel-title {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .panel-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            color: var(--text-primary);
        }

        .action-btn:hover {
            border-color: var(--accent-1);
        }

        .action-btn.primary {
            background: var(--accent-gradient);
            border: none;
            color: white;
        }

        textarea {
            width: 100%;
            height: 400px;
            padding: 1.5rem;
            background: transparent;
            border: none;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: var(--text-primary);
            resize: none;
            outline: none;
        }

        .output-content {
            padding: 1.5rem;
            height: 400px;
            overflow: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 1.5rem;
            background: var(--bg-secondary);
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .status-valid {
            color: var(--success);
        }

        .status-invalid {
            color: var(--danger);
        }

        .json-key {
            color: var(--json-key);
        }

        .json-string {
            color: var(--json-string);
        }

        .json-number {
            color: var(--json-number);
        }

        .json-bool {
            color: var(--json-bool);
        }

        .json-null {
            color: var(--text-muted);
        }

        .error-message {
            color: var(--danger);
            padding: 1.5rem;
        }

        @media (max-width: 900px) {
            .editor-container {
                grid-template-columns: 1fr;
            }

            textarea,
            .output-content {
                height: 300px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-shapes">
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>
    </div>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
            <button class="theme-toggle" id="themeToggle">
                <div class="toggle-thumb"></div>
            </button>
        </div>
    </nav>
    <main class="main-content">
        <div class="tool-container">
            <a href="index.html" class="back-link">← Back to Tools</a>
            <div class="tool-header">
                <div class="tool-icon">{ }</div>
                <h1>JSON Formatter & Validator</h1>
                <p>Beautify, validate, and minify JSON data</p>
            </div>
            <div class="editor-container">
                <div class="editor-panel">
                    <div class="panel-header">
                        <div class="panel-title">📝 Input</div>
                        <div class="panel-actions">
                            <button class="action-btn" onclick="loadSample()">Sample</button>
                            <button class="action-btn" onclick="clearInput()">Clear</button>
                        </div>
                    </div>
                    <textarea id="jsonInput" placeholder="Paste your JSON here...">{
  "name": "AIO Tools Hub",
  "version": "2.0",
  "features": ["fast", "secure", "free"],
  "stats": {
    "tools": 30,
    "users": 10000
  }
}</textarea>
                    <div class="status-bar">
                        <span id="inputStatus">Ready</span>
                        <span id="charCount">0 characters</span>
                    </div>
                </div>
                <div class="editor-panel">
                    <div class="panel-header">
                        <div class="panel-title">✨ Output</div>
                        <div class="panel-actions">
                            <button class="action-btn primary" onclick="formatJSON()">Format</button>
                            <button class="action-btn" onclick="minifyJSON()">Minify</button>
                            <button class="action-btn" onclick="copyOutput()">Copy</button>
                        </div>
                    </div>
                    <div class="output-content" id="jsonOutput"></div>
                    <div class="status-bar">
                        <span id="outputStatus">-</span>
                        <span id="outputSize">-</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const setTheme = t => { document.documentElement.dataset.theme = t; localStorage.setItem('theme', t); };
        themeToggle.onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
        setTheme(localStorage.getItem('theme') || 'dark');

        const jsonInput = document.getElementById('jsonInput');
        const jsonOutput = document.getElementById('jsonOutput');
        const inputStatus = document.getElementById('inputStatus');
        const charCount = document.getElementById('charCount');
        const outputStatus = document.getElementById('outputStatus');
        const outputSize = document.getElementById('outputSize');

        jsonInput.oninput = () => {
            charCount.textContent = jsonInput.value.length + ' characters';
            validateJSON();
        };

        function validateJSON() {
            try {
                if (jsonInput.value.trim()) {
                    JSON.parse(jsonInput.value);
                    inputStatus.textContent = '✓ Valid JSON';
                    inputStatus.className = 'status-valid';
                    return true;
                }
                inputStatus.textContent = 'Ready';
                inputStatus.className = '';
                return false;
            } catch (e) {
                inputStatus.textContent = '✗ Invalid: ' + e.message.split(' at ')[0];
                inputStatus.className = 'status-invalid';
                return false;
            }
        }

        function formatJSON() {
            try {
                const parsed = JSON.parse(jsonInput.value);
                const formatted = JSON.stringify(parsed, null, 2);
                jsonOutput.innerHTML = syntaxHighlight(formatted);
                outputStatus.textContent = '✓ Formatted';
                outputStatus.className = 'status-valid';
                outputSize.textContent = formatted.length + ' characters';
            } catch (e) {
                jsonOutput.innerHTML = '<span class="error-message">Error: ' + e.message + '</span>';
                outputStatus.textContent = '✗ Error';
                outputStatus.className = 'status-invalid';
            }
        }

        function minifyJSON() {
            try {
                const parsed = JSON.parse(jsonInput.value);
                const minified = JSON.stringify(parsed);
                jsonOutput.textContent = minified;
                outputStatus.textContent = '✓ Minified';
                outputStatus.className = 'status-valid';
                outputSize.textContent = minified.length + ' characters';
            } catch (e) {
                jsonOutput.innerHTML = '<span class="error-message">Error: ' + e.message + '</span>';
            }
        }

        function syntaxHighlight(json) {
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, match => {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    cls = /:$/.test(match) ? 'json-key' : 'json-string';
                } else if (/true|false/.test(match)) {
                    cls = 'json-bool';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        function copyOutput() {
            const text = jsonOutput.textContent;
            navigator.clipboard.writeText(text);
            const btn = event.target;
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = 'Copy', 1500);
        }

        function clearInput() {
            jsonInput.value = '';
            jsonOutput.innerHTML = '';
            inputStatus.textContent = 'Ready';
            inputStatus.className = '';
            charCount.textContent = '0 characters';
            outputStatus.textContent = '-';
            outputSize.textContent = '-';
        }

        function loadSample() {
            jsonInput.value = `{
  "name": "AIO Tools Hub",
  "version": "2.0",
  "description": "Free online tools for everyone",
  "features": ["fast", "secure", "free", "no signup"],
  "categories": {
    "image": 5,
    "calculator": 6,
    "developer": 6
  },
  "isActive": true,
  "lastUpdate": null
}`;
            charCount.textContent = jsonInput.value.length + ' characters';
            validateJSON();
        }

        // Initial validation
        charCount.textContent = jsonInput.value.length + ' characters';
        validateJSON();
        formatJSON();
    </script>
</body>

</html>
