<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Compressor - AIO Tools Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4ff, #e8e0ff, #fce4ff);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --bg-secondary: #fff;
            --success: #10b981;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0a0a1a, #1a1035, #0d1520);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #fff;
            --text-secondary: #b4b4d4;
            --nav-bg: rgba(10, 10, 26, 0.9);
            --bg-secondary: #12122a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        .main-content {
            padding: 100px 2rem 40px;
            max-width: 700px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            background: var(--accent-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }

        .tool-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
        }

        .upload-zone {
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1.5rem;
        }

        .upload-zone:hover {
            border-color: #7c3aed;
        }

        .upload-zone .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        #fileInput {
            display: none;
        }

        .quality-section {
            margin-bottom: 1.5rem;
        }

        .quality-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: var(--glass-border);
            border-radius: 4px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            display: none;
            margin-top: 1.5rem;
        }

        .result.show {
            display: block;
        }

        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .compare-box {
            background: var(--bg-secondary);
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
        }

        .compare-box img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .size {
            font-weight: 700;
        }

        .savings {
            text-align: center;
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        .savings-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--success);
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
        <button class="theme-toggle" id="themeToggle">
            <div class="toggle-thumb"></div>
        </button>
    </nav>
    <main class="main-content">
        <a href="index.html" class="back-link">← Back to Tools</a>
        <div class="tool-header">
            <div class="tool-icon">📦</div>
            <h1>Image Compressor</h1>
            <p>Compress images without losing quality</p>
        </div>
        <div class="tool-card">
            <div class="upload-zone" id="uploadZone">
                <div class="icon">📁</div>
                <h3>Drop image here or click to upload</h3>
                <p>JPG, PNG, WEBP supported</p>
                <input type="file" id="fileInput" accept="image/*">
            </div>
            <div class="quality-section">
                <div class="quality-header"><span>Quality</span><span id="qualityValue">80%</span></div>
                <input type="range" id="quality" min="10" max="100" value="80">
            </div>
            <button class="btn" id="compressBtn" disabled>Compress Image</button>
            <div class="result" id="result">
                <div class="savings">
                    <div class="savings-value" id="savings">0%</div>
                    <div>Size Reduced</div>
                </div>
                <div class="comparison">
                    <div class="compare-box"><img id="origImg" alt="Original">
                        <div>Original: <span class="size" id="origSize">0 KB</span></div>
                    </div>
                    <div class="compare-box"><img id="compImg" alt="Compressed">
                        <div>Compressed: <span class="size" id="compSize">0 KB</span></div>
                    </div>
                </div>
                <button class="btn" id="downloadBtn">⬇️ Download Compressed</button>
            </div>
        </div>
    </main>
    <script>
        document.getElementById('themeToggle').onclick = () => {
            const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = t; localStorage.setItem('theme', t);
        };
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const quality = document.getElementById('quality');
        const compressBtn = document.getElementById('compressBtn');
        let originalFile = null, originalImg = null;

        uploadZone.onclick = () => fileInput.click();
        uploadZone.ondragover = e => e.preventDefault();
        uploadZone.ondrop = e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); };
        fileInput.onchange = e => handleFile(e.target.files[0]);
        quality.oninput = () => document.getElementById('qualityValue').textContent = quality.value + '%';

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            originalFile = file;
            const reader = new FileReader();
            reader.onload = e => {
                originalImg = new Image();
                originalImg.onload = () => compressBtn.disabled = false;
                originalImg.src = e.target.result;
                document.getElementById('origImg').src = e.target.result;
                document.getElementById('origSize').textContent = (file.size / 1024).toFixed(1) + ' KB';
            };
            reader.readAsDataURL(file);
        }

        compressBtn.onclick = () => {
            const canvas = document.createElement('canvas');
            canvas.width = originalImg.width;
            canvas.height = originalImg.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(originalImg, 0, 0);
            const dataUrl = canvas.toDataURL('image/jpeg', quality.value / 100);

            document.getElementById('compImg').src = dataUrl;
            const compSize = Math.round((dataUrl.length * 3) / 4);
            document.getElementById('compSize').textContent = (compSize / 1024).toFixed(1) + ' KB';
            const saved = Math.round((1 - compSize / originalFile.size) * 100);
            document.getElementById('savings').textContent = saved + '%';
            document.getElementById('result').classList.add('show');

            document.getElementById('downloadBtn').onclick = () => {
                const link = document.createElement('a');
                link.download = 'compressed-image.jpg';
                link.href = dataUrl;
                link.click();
            };
        };
    </script>
</body>

</html>
