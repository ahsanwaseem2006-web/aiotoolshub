<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hash Generator - AIO Tools Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4ff, #e8e0ff, #fce4ff);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --bg-secondary: #fff;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0a0a1a, #1a1035, #0d1520);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #fff;
            --text-secondary: #b4b4d4;
            --nav-bg: rgba(10, 10, 26, 0.9);
            --bg-secondary: #12122a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        .main-content {
            padding: 100px 2rem 40px;
            max-width: 700px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            background: var(--accent-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }

        .tool-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: inherit;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            margin-bottom: 1.5rem;
        }

        .hash-grid {
            display: grid;
            gap: 1rem;
        }

        .hash-item {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1rem;
        }

        .hash-label {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        .hash-value {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .hash-value code {
            flex: 1;
            font-family: monospace;
            font-size: 0.85rem;
            word-break: break-all;
            background: var(--glass-bg);
            padding: 0.5rem;
            border-radius: 6px;
        }

        .copy-btn {
            padding: 8px 12px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
        <button class="theme-toggle" id="themeToggle">
            <div class="toggle-thumb"></div>
        </button>
    </nav>
    <main class="main-content">
        <a href="index.html" class="back-link">← Back to Tools</a>
        <div class="tool-header">
            <div class="tool-icon">🔐</div>
            <h1>Hash Generator</h1>
            <p>Generate various hash values for text</p>
        </div>
        <div class="tool-card">
            <div class="input-group">
                <label>Enter Text</label>
                <textarea id="input" placeholder="Enter text to hash...">Hello World</textarea>
            </div>
            <button class="btn" onclick="generateHashes()">Generate Hashes</button>
            <div class="hash-grid" id="hashes"></div>
        </div>
    </main>
    <script>
        document.getElementById('themeToggle').onclick = () => {
            const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = t; localStorage.setItem('theme', t);
        };
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';

        async function sha(algo, text) {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const hash = await crypto.subtle.digest(algo, data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Simple MD5 implementation
        function md5(string) {
            function rotateLeft(x, n) { return (x << n) | (x >>> (32 - n)); }
            function addUnsigned(x, y) { return (x + y) >>> 0; }
            const k = [], s = [];
            for (let i = 0; i < 64; i++) { k[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 0x100000000); }
            s.push(7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22);
            s.push(5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20);
            s.push(4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23);
            s.push(6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21);

            let msg = string + String.fromCharCode(0x80);
            while ((msg.length % 64) !== 56) msg += String.fromCharCode(0);
            const len = string.length * 8;
            msg += String.fromCharCode(len & 0xff, (len >> 8) & 0xff, (len >> 16) & 0xff, (len >> 24) & 0xff, 0, 0, 0, 0);

            let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;

            for (let i = 0; i < msg.length; i += 64) {
                const m = [];
                for (let j = 0; j < 16; j++) {
                    m[j] = msg.charCodeAt(i + j * 4) | (msg.charCodeAt(i + j * 4 + 1) << 8) | (msg.charCodeAt(i + j * 4 + 2) << 16) | (msg.charCodeAt(i + j * 4 + 3) << 24);
                }
                let a = a0, b = b0, c = c0, d = d0;
                for (let j = 0; j < 64; j++) {
                    let f, g;
                    if (j < 16) { f = (b & c) | ((~b) & d); g = j; }
                    else if (j < 32) { f = (d & b) | ((~d) & c); g = (5 * j + 1) % 16; }
                    else if (j < 48) { f = b ^ c ^ d; g = (3 * j + 5) % 16; }
                    else { f = c ^ (b | (~d)); g = (7 * j) % 16; }
                    const temp = d; d = c; c = b;
                    b = addUnsigned(b, rotateLeft(addUnsigned(addUnsigned(a, f), addUnsigned(k[j], m[g])), s[j]));
                    a = temp;
                }
                a0 = addUnsigned(a0, a); b0 = addUnsigned(b0, b); c0 = addUnsigned(c0, c); d0 = addUnsigned(d0, d);
            }

            const hex = n => (n >>> 0).toString(16).padStart(8, '0').match(/../g).reverse().join('');
            return hex(a0) + hex(b0) + hex(c0) + hex(d0);
        }

        async function generateHashes() {
            const text = document.getElementById('input').value;
            const hashes = [
                { name: 'MD5', value: md5(text) },
                { name: 'SHA-1', value: await sha('SHA-1', text) },
                { name: 'SHA-256', value: await sha('SHA-256', text) },
                { name: 'SHA-384', value: await sha('SHA-384', text) },
                { name: 'SHA-512', value: await sha('SHA-512', text) }
            ];

            document.getElementById('hashes').innerHTML = hashes.map((h, i) => `
                <div class="hash-item">
                    <div class="hash-label">${h.name}</div>
                    <div class="hash-value">
                        <code id="hash${i}">${h.value}</code>
                        <button class="copy-btn" onclick="copyHash(${i})">Copy</button>
                    </div>
                </div>
            `).join('');
        }

        function copyHash(i) {
            navigator.clipboard.writeText(document.getElementById('hash' + i).textContent);
            event.target.textContent = '✓';
            setTimeout(() => event.target.textContent = 'Copy', 1000);
        }

        generateHashes();
    </script>
</body>

</html>
