<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker - AIO Tools Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4ff, #e8e0ff, #fce4ff);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --bg-secondary: #fff;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0a0a1a, #1a1035, #0d1520);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #fff;
            --text-secondary: #b4b4d4;
            --nav-bg: rgba(10, 10, 26, 0.9);
            --bg-secondary: #12122a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        .main-content {
            padding: 100px 2rem 40px;
            max-width: 550px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            background: var(--accent-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }

        .tool-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .password-input {
            position: relative;
        }

        input {
            width: 100%;
            padding: 16px 50px 16px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1.1rem;
            color: var(--text-primary);
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .toggle-visibility {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
        }

        .strength-meter {
            height: 8px;
            background: var(--glass-border);
            border-radius: 4px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            transition: all 0.3s;
            border-radius: 4px;
        }

        .strength-text {
            text-align: center;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .criteria {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .criteria h3 {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        .criterion {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 0;
        }

        .criterion-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            background: var(--glass-border);
        }

        .criterion.pass .criterion-icon {
            background: #10b981;
            color: white;
        }

        .criterion.fail .criterion-icon {
            background: #ef4444;
            color: white;
        }

        .time-to-crack {
            margin-top: 1.5rem;
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: 12px;
            text-align: center;
        }

        .time-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .time-value {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
        <button class="theme-toggle" id="themeToggle">
            <div class="toggle-thumb"></div>
        </button>
    </nav>
    <main class="main-content">
        <a href="index.html" class="back-link">← Back to Tools</a>
        <div class="tool-header">
            <div class="tool-icon">🔒</div>
            <h1>Password Strength</h1>
            <p>Check how secure your password is</p>
        </div>
        <div class="tool-card">
            <div class="input-group">
                <label>Enter Password</label>
                <div class="password-input">
                    <input type="password" id="password" placeholder="Type your password...">
                    <button class="toggle-visibility" onclick="toggleVisibility()">👁️</button>
                </div>
            </div>
            <div class="strength-meter">
                <div class="strength-fill" id="strengthFill"></div>
            </div>
            <div class="strength-text" id="strengthText">Enter a password</div>
            <div class="criteria">
                <h3>Password Requirements</h3>
                <div class="criterion" id="length"><span class="criterion-icon">✗</span> At least 8 characters</div>
                <div class="criterion" id="upper"><span class="criterion-icon">✗</span> Uppercase letter (A-Z)</div>
                <div class="criterion" id="lower"><span class="criterion-icon">✗</span> Lowercase letter (a-z)</div>
                <div class="criterion" id="number"><span class="criterion-icon">✗</span> Number (0-9)</div>
                <div class="criterion" id="special"><span class="criterion-icon">✗</span> Special character (!@#$%...)
                </div>
            </div>
            <div class="time-to-crack">
                <div class="time-label">Estimated time to crack</div>
                <div class="time-value" id="crackTime">-</div>
            </div>
        </div>
    </main>
    <script>
        document.getElementById('themeToggle').onclick = () => {
            const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = t; localStorage.setItem('theme', t);
        };
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';

        function toggleVisibility() {
            const pwd = document.getElementById('password');
            pwd.type = pwd.type === 'password' ? 'text' : 'password';
        }

        const colors = { weak: '#ef4444', fair: '#f97316', good: '#eab308', strong: '#22c55e', verystrong: '#10b981' };
        const labels = { 0: 'Very Weak', 1: 'Weak', 2: 'Fair', 3: 'Good', 4: 'Strong', 5: 'Very Strong' };

        document.getElementById('password').oninput = function () {
            const pwd = this.value;
            let score = 0;

            const checks = {
                length: pwd.length >= 8,
                upper: /[A-Z]/.test(pwd),
                lower: /[a-z]/.test(pwd),
                number: /[0-9]/.test(pwd),
                special: /[^A-Za-z0-9]/.test(pwd)
            };

            Object.entries(checks).forEach(([id, pass]) => {
                const el = document.getElementById(id);
                el.className = 'criterion ' + (pass ? 'pass' : 'fail');
                el.querySelector('.criterion-icon').textContent = pass ? '✓' : '✗';
                if (pass) score++;
            });

            // Bonus for length
            if (pwd.length >= 12) score = Math.min(score + 0.5, 5);
            if (pwd.length >= 16) score = Math.min(score + 0.5, 5);

            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');

            if (!pwd) {
                fill.style.width = '0%';
                text.textContent = 'Enter a password';
                text.style.color = 'var(--text-secondary)';
            } else {
                const percent = (score / 5) * 100;
                fill.style.width = percent + '%';

                let color, label;
                if (score < 2) { color = colors.weak; label = 'Weak'; }
                else if (score < 3) { color = colors.fair; label = 'Fair'; }
                else if (score < 4) { color = colors.good; label = 'Good'; }
                else if (score < 5) { color = colors.strong; label = 'Strong'; }
                else { color = colors.verystrong; label = 'Very Strong'; }

                fill.style.background = color;
                text.textContent = label;
                text.style.color = color;
            }

            // Estimate crack time
            const charset = (checks.lower ? 26 : 0) + (checks.upper ? 26 : 0) + (checks.number ? 10 : 0) + (checks.special ? 32 : 0) || 26;
            const combinations = Math.pow(charset, pwd.length || 1);
            const attempts = 10e9; // 10 billion per second
            const seconds = combinations / attempts;

            let time = '-';
            if (pwd) {
                if (seconds < 1) time = 'Instantly';
                else if (seconds < 60) time = Math.round(seconds) + ' seconds';
                else if (seconds < 3600) time = Math.round(seconds / 60) + ' minutes';
                else if (seconds < 86400) time = Math.round(seconds / 3600) + ' hours';
                else if (seconds < 31536000) time = Math.round(seconds / 86400) + ' days';
                else if (seconds < 31536000 * 1000) time = Math.round(seconds / 31536000) + ' years';
                else time = '1000+ years';
            }
            document.getElementById('crackTime').textContent = time;
        };
    </script>
</body>

</html>
