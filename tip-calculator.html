<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator - AIO Tools Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4ff, #e8e0ff, #fce4ff);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --bg-secondary: #fff;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0a0a1a, #1a1035, #0d1520);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #fff;
            --text-secondary: #b4b4d4;
            --nav-bg: rgba(10, 10, 26, 0.9);
            --bg-secondary: #12122a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        .main-content {
            padding: 100px 2rem 40px;
            max-width: 500px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            background: var(--accent-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }

        .tool-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1.25rem;
            color: var(--text-primary);
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .tip-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .tip-btn {
            flex: 1;
            min-width: 60px;
            padding: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            color: var(--text-primary);
        }

        .tip-btn.active {
            background: var(--accent-gradient);
            border-color: transparent;
            color: white;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .result-box {
            background: var(--bg-secondary);
            padding: 1.25rem;
            border-radius: 14px;
            text-align: center;
        }

        .result-box.full {
            grid-column: span 2;
        }

        .result-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .result-value {
            font-size: 1.75rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .result-value.big {
            font-size: 2.5rem;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
        <button class="theme-toggle" id="themeToggle">
            <div class="toggle-thumb"></div>
        </button>
    </nav>
    <main class="main-content">
        <a href="index.html" class="back-link">← Back to Tools</a>
        <div class="tool-header">
            <div class="tool-icon">💵</div>
            <h1>Tip Calculator</h1>
            <p>Calculate tips and split bills</p>
        </div>
        <div class="tool-card">
            <div class="input-group">
                <label>Bill Amount ($)</label>
                <input type="number" id="bill" value="100" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>Tip Percentage</label>
                <div class="tip-buttons">
                    <button class="tip-btn" onclick="setTip(10)">10%</button>
                    <button class="tip-btn" onclick="setTip(15)">15%</button>
                    <button class="tip-btn active" onclick="setTip(18)">18%</button>
                    <button class="tip-btn" onclick="setTip(20)">20%</button>
                    <button class="tip-btn" onclick="setTip(25)">25%</button>
                </div>
                <input type="number" id="tipPercent" value="18" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>Split Between (people)</label>
                <input type="number" id="people" value="1" min="1" oninput="calculate()">
            </div>
            <div class="result-grid">
                <div class="result-box">
                    <div class="result-label">Tip Amount</div>
                    <div class="result-value" id="tipAmount">$18.00</div>
                </div>
                <div class="result-box">
                    <div class="result-label">Total</div>
                    <div class="result-value" id="total">$118.00</div>
                </div>
                <div class="result-box full">
                    <div class="result-label">Each Person Pays</div>
                    <div class="result-value big" id="perPerson">$118.00</div>
                </div>
            </div>
        </div>
    </main>
    <script>
        document.getElementById('themeToggle').onclick = () => {
            const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = t; localStorage.setItem('theme', t);
        };
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';

        function setTip(percent) {
            document.getElementById('tipPercent').value = percent;
            document.querySelectorAll('.tip-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            calculate();
        }

        function calculate() {
            const bill = parseFloat(document.getElementById('bill').value) || 0;
            const tipPercent = parseFloat(document.getElementById('tipPercent').value) || 0;
            const people = parseInt(document.getElementById('people').value) || 1;

            const tip = bill * tipPercent / 100;
            const total = bill + tip;
            const perPerson = total / people;

            const fmt = n => '$' + n.toFixed(2);
            document.getElementById('tipAmount').textContent = fmt(tip);
            document.getElementById('total').textContent = fmt(total);
            document.getElementById('perPerson').textContent = fmt(perPerson);
        }

        calculate();
    </script>
</body>

</html>
