<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculator - AIO Tools Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4ff, #e8e0ff, #fce4ff);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --bg-secondary: #fff;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0a0a1a, #1a1035, #0d1520);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #fff;
            --text-secondary: #b4b4d4;
            --nav-bg: rgba(10, 10, 26, 0.9);
            --bg-secondary: #12122a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        .main-content {
            padding: 100px 2rem 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            background: var(--accent-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }

        .tool-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .result {
            display: none;
            margin-top: 2rem;
        }

        .result.show {
            display: block;
        }

        .result-main {
            text-align: center;
            padding: 2rem;
            background: var(--bg-secondary);
            border-radius: 16px;
            margin-bottom: 1.5rem;
        }

        .emi {
            font-size: 3rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .emi-label {
            color: var(--text-secondary);
        }

        .breakdown {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .breakdown-item {
            background: var(--bg-secondary);
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
        }

        .breakdown-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .breakdown-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
        <button class="theme-toggle" id="themeToggle">
            <div class="toggle-thumb"></div>
        </button>
    </nav>
    <main class="main-content">
        <a href="index.html" class="back-link">← Back to Tools</a>
        <div class="tool-header">
            <div class="tool-icon">💰</div>
            <h1>Loan Calculator</h1>
            <p>Calculate EMI and loan payments</p>
        </div>
        <div class="tool-card">
            <div class="input-group">
                <label>Loan Amount ($)</label>
                <input type="number" id="principal" value="100000" min="1">
            </div>
            <div class="input-group">
                <label>Interest Rate (% per year)</label>
                <input type="number" id="rate" value="7" min="0.1" step="0.1">
            </div>
            <div class="input-group">
                <label>Loan Term (months)</label>
                <input type="number" id="term" value="60" min="1">
            </div>
            <button class="btn" onclick="calculate()">Calculate EMI</button>
            <div class="result" id="result">
                <div class="result-main">
                    <div class="emi" id="emi">$0</div>
                    <div class="emi-label">Monthly Payment (EMI)</div>
                </div>
                <div class="breakdown">
                    <div class="breakdown-item">
                        <div class="breakdown-value" id="total">$0</div>
                        <div class="breakdown-label">Total Payment</div>
                    </div>
                    <div class="breakdown-item">
                        <div class="breakdown-value" id="interest">$0</div>
                        <div class="breakdown-label">Total Interest</div>
                    </div>
                    <div class="breakdown-item">
                        <div class="breakdown-value" id="principalPaid">$0</div>
                        <div class="breakdown-label">Principal</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
        document.getElementById('themeToggle').onclick = () => {
            const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = t; localStorage.setItem('theme', t);
        };
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';

        function calculate() {
            const P = parseFloat(document.getElementById('principal').value);
            const r = parseFloat(document.getElementById('rate').value) / 100 / 12;
            const n = parseInt(document.getElementById('term').value);

            if (!P || !r || !n) { alert('Please fill all fields'); return; }

            const emi = P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
            const total = emi * n;
            const interest = total - P;

            const fmt = num => '$' + num.toLocaleString('en-US', { maximumFractionDigits: 0 });
            document.getElementById('emi').textContent = fmt(emi);
            document.getElementById('total').textContent = fmt(total);
            document.getElementById('interest').textContent = fmt(interest);
            document.getElementById('principalPaid').textContent = fmt(P);
            document.getElementById('result').classList.add('show');
        }
    </script>
</body>

</html>
