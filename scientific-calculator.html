<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator - AIO Tools Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4ff, #e8e0ff, #fce4ff);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --accent-1: #7c3aed;
            --accent-2: #06b6d4;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --btn-num: rgba(255, 255, 255, 0.8);
            --btn-op: rgba(124, 58, 237, 0.2);
            --btn-func: rgba(6, 182, 212, 0.2);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0a0a1a, #1a1035, #0d1520);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #fff;
            --text-secondary: #b4b4d4;
            --accent-1: #a78bfa;
            --accent-2: #22d3ee;
            --nav-bg: rgba(10, 10, 26, 0.9);
            --btn-num: rgba(255, 255, 255, 0.1);
            --btn-op: rgba(167, 139, 250, 0.3);
            --btn-func: rgba(34, 211, 238, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
            color: inherit;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        .main-content {
            padding: 100px 1rem 40px;
            max-width: 400px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            background: var(--accent-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }

        .tool-header h1 {
            font-size: 1.75rem;
            margin-bottom: 0.25rem;
        }

        .tool-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .calculator {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.25rem;
        }

        .display {
            background: var(--btn-num);
            border-radius: 14px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            text-align: right;
        }

        .expression {
            font-size: 0.9rem;
            color: var(--text-secondary);
            min-height: 20px;
            word-break: break-all;
        }

        .result {
            font-size: 2.25rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .btn {
            padding: 14px 6px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
            font-family: inherit;
            color: var(--text-primary);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-num {
            background: var(--btn-num);
        }

        .btn-op {
            background: var(--btn-op);
        }

        .btn-func {
            background: var(--btn-func);
            font-size: 0.8rem;
        }

        .btn-equals {
            background: var(--accent-gradient);
            color: white;
            grid-column: span 2;
        }

        .btn-clear {
            background: #ef4444;
            color: white;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
        <button class="theme-toggle" id="themeToggle">
            <div class="toggle-thumb"></div>
        </button>
    </nav>
    <main class="main-content">
        <a href="index.html" class="back-link">← Back to Tools</a>
        <div class="tool-header">
            <div class="tool-icon">🧮</div>
            <h1>Scientific Calculator</h1>
            <p>Advanced math functions</p>
        </div>
        <div class="calculator">
            <div class="display">
                <div class="expression" id="expression"></div>
                <div class="result" id="result">0</div>
            </div>
            <div class="buttons">
                <button class="btn btn-func" onclick="addFunc('sin(')">sin</button>
                <button class="btn btn-func" onclick="addFunc('cos(')">cos</button>
                <button class="btn btn-func" onclick="addFunc('tan(')">tan</button>
                <button class="btn btn-func" onclick="addFunc('log(')">log</button>
                <button class="btn btn-func" onclick="addFunc('sqrt(')">√</button>
                <button class="btn btn-clear" onclick="clearAll()">C</button>
                <button class="btn btn-op" onclick="addChar('(')">(</button>
                <button class="btn btn-op" onclick="addChar(')')">)</button>
                <button class="btn btn-op" onclick="addChar('%')">%</button>
                <button class="btn btn-op" onclick="addChar('/')">÷</button>
                <button class="btn btn-num" onclick="addChar('7')">7</button>
                <button class="btn btn-num" onclick="addChar('8')">8</button>
                <button class="btn btn-num" onclick="addChar('9')">9</button>
                <button class="btn btn-op" onclick="backspace()">⌫</button>
                <button class="btn btn-op" onclick="addChar('*')">×</button>
                <button class="btn btn-num" onclick="addChar('4')">4</button>
                <button class="btn btn-num" onclick="addChar('5')">5</button>
                <button class="btn btn-num" onclick="addChar('6')">6</button>
                <button class="btn btn-op" onclick="addChar('-')">−</button>
                <button class="btn btn-op" onclick="addChar('+')">+</button>
                <button class="btn btn-num" onclick="addChar('1')">1</button>
                <button class="btn btn-num" onclick="addChar('2')">2</button>
                <button class="btn btn-num" onclick="addChar('3')">3</button>
                <button class="btn btn-equals" onclick="calculate()">=</button>
                <button class="btn btn-num" onclick="addChar('0')">0</button>
                <button class="btn btn-num" onclick="addChar('00')">00</button>
                <button class="btn btn-num" onclick="addChar('.')">.</button>
            </div>
        </div>
    </main>
    <script>
        document.getElementById('themeToggle').onclick = () => {
            const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = t;
            localStorage.setItem('theme', t);
        };
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';
        let expr = '';
        function addChar(c) { expr += c; document.getElementById('expression').textContent = expr; }
        function addFunc(f) { expr += f; document.getElementById('expression').textContent = expr; }
        function clearAll() { expr = ''; document.getElementById('expression').textContent = ''; document.getElementById('result').textContent = '0'; }
        function backspace() { expr = expr.slice(0, -1); document.getElementById('expression').textContent = expr; }
        function calculate() {
            try {
                let e = expr.replace(/sin\(/g, 'Math.sin(').replace(/cos\(/g, 'Math.cos(').replace(/tan\(/g, 'Math.tan(').replace(/log\(/g, 'Math.log10(').replace(/sqrt\(/g, 'Math.sqrt(');
                document.getElementById('result').textContent = parseFloat(eval(e).toFixed(10));
            } catch { document.getElementById('result').textContent = 'Error'; }
        }
    </script>
</body>

</html>
