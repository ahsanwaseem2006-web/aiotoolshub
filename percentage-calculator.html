<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator - AIO Tools Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4ff, #e8e0ff, #fce4ff);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --bg-secondary: #fff;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0a0a1a, #1a1035, #0d1520);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #fff;
            --text-secondary: #b4b4d4;
            --nav-bg: rgba(10, 10, 26, 0.9);
            --bg-secondary: #12122a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        .main-content {
            padding: 100px 2rem 40px;
            max-width: 550px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            background: var(--accent-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }

        .tool-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
        }

        .calc-section {
            background: var(--bg-secondary);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .calc-title {
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .calc-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .calc-row span {
            color: var(--text-secondary);
        }

        input {
            padding: 12px 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: inherit;
            width: 100px;
        }

        input:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .result {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--glass-bg);
            border-radius: 10px;
            text-align: center;
        }

        .result-value {
            font-size: 1.75rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
        <button class="theme-toggle" id="themeToggle">
            <div class="toggle-thumb"></div>
        </button>
    </nav>
    <main class="main-content">
        <a href="index.html" class="back-link">← Back to Tools</a>
        <div class="tool-header">
            <div class="tool-icon">📊</div>
            <h1>Percentage Calculator</h1>
            <p>Calculate percentages easily</p>
        </div>
        <div class="tool-card">
            <div class="calc-section">
                <div class="calc-title">📌 What is X% of Y?</div>
                <div class="calc-row">
                    <span>What is</span>
                    <input type="number" id="p1" value="25" oninput="calc1()">
                    <span>% of</span>
                    <input type="number" id="n1" value="200" oninput="calc1()">
                    <span>?</span>
                </div>
                <div class="result">
                    <div class="result-value" id="r1">50</div>
                </div>
            </div>
            <div class="calc-section">
                <div class="calc-title">📌 X is what % of Y?</div>
                <div class="calc-row">
                    <input type="number" id="n2" value="50" oninput="calc2()">
                    <span>is what % of</span>
                    <input type="number" id="n3" value="200" oninput="calc2()">
                    <span>?</span>
                </div>
                <div class="result">
                    <div class="result-value" id="r2">25%</div>
                </div>
            </div>
            <div class="calc-section">
                <div class="calc-title">📌 Percentage Change</div>
                <div class="calc-row">
                    <span>From</span>
                    <input type="number" id="old" value="100" oninput="calc3()">
                    <span>to</span>
                    <input type="number" id="new" value="150" oninput="calc3()">
                </div>
                <div class="result">
                    <div class="result-value" id="r3">+50%</div>
                </div>
            </div>
        </div>
    </main>
    <script>
        document.getElementById('themeToggle').onclick = () => {
            const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = t; localStorage.setItem('theme', t);
        };
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';

        function calc1() {
            const p = parseFloat(document.getElementById('p1').value) || 0;
            const n = parseFloat(document.getElementById('n1').value) || 0;
            document.getElementById('r1').textContent = (p * n / 100).toFixed(2);
        }

        function calc2() {
            const x = parseFloat(document.getElementById('n2').value) || 0;
            const y = parseFloat(document.getElementById('n3').value) || 1;
            document.getElementById('r2').textContent = (x / y * 100).toFixed(2) + '%';
        }

        function calc3() {
            const old = parseFloat(document.getElementById('old').value) || 1;
            const newVal = parseFloat(document.getElementById('new').value) || 0;
            const change = ((newVal - old) / old * 100).toFixed(2);
            document.getElementById('r3').textContent = (change >= 0 ? '+' : '') + change + '%';
        }
    </script>
</body>

</html>
