<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator - AIO Tools Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="description"
        content="Free BMI Calculator - Calculate your Body Mass Index instantly. Get health insights and weight category information.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script defer data-domain="aiotoolshub.com" src="https://plausible.io/js/script.js"></script>
    <style>
        :root {
            --bg-primary: #f0f4ff;
            --bg-secondary: #ffffff;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e8e0ff 50%, #fce4ff 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #7a7a9a;
            --accent-1: #7c3aed;
            --accent-2: #06b6d4;
            --accent-3: #f43f5e;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --card-hover-glow: 0 0 30px rgba(124, 58, 237, 0.3);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        [data-theme="dark"] {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-gradient: linear-gradient(135deg, #0a0a1a 0%, #1a1035 50%, #0d1520 100%);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #b4b4d4;
            --text-muted: #7a7a9a;
            --accent-1: #a78bfa;
            --accent-2: #22d3ee;
            --accent-3: #fb7185;
            --accent-gradient: linear-gradient(135deg, #a78bfa, #22d3ee);
            --card-hover-glow: 0 0 40px rgba(167, 139, 250, 0.4);
            --nav-bg: rgba(10, 10, 26, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            transition: all 0.3s ease;
        }

        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 20s ease-in-out infinite;
        }

        .bg-shape:nth-child(1) {
            width: 600px;
            height: 600px;
            background: var(--accent-1);
            top: -200px;
            right: -200px;
        }

        .bg-shape:nth-child(2) {
            width: 500px;
            height: 500px;
            background: var(--accent-2);
            bottom: -150px;
            left: -150px;
            animation-delay: -7s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(-20px, 20px) scale(0.95);
            }
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
            color: inherit;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-1);
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .toggle-thumb::before {
            content: '🌙';
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        [data-theme="light"] .toggle-thumb::before {
            content: '☀️';
        }

        .main-content {
            padding: 120px 2rem 60px;
            position: relative;
            z-index: 1;
        }

        .tool-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 80px;
            height: 80px;
            background: var(--accent-gradient);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
        }

        .tool-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: var(--glass-shadow);
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .input-row {
            display: flex;
            gap: 1rem;
        }

        .input-row .input-group {
            flex: 1;
        }

        input,
        select {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: inherit;
            transition: all 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-1);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.4);
        }

        .result-card {
            margin-top: 2rem;
            padding: 2rem;
            background: var(--bg-secondary);
            border-radius: 16px;
            text-align: center;
            display: none;
        }

        .result-card.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .bmi-value {
            font-size: 4rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .bmi-category {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .bmi-category.underweight {
            color: var(--accent-2);
        }

        .bmi-category.normal {
            color: var(--success);
        }

        .bmi-category.overweight {
            color: var(--warning);
        }

        .bmi-category.obese {
            color: var(--danger);
        }

        .bmi-bar {
            height: 8px;
            background: linear-gradient(to right, var(--accent-2), var(--success), var(--warning), var(--danger));
            border-radius: 4px;
            margin: 1.5rem 0;
            position: relative;
        }

        .bmi-indicator {
            position: absolute;
            top: -5px;
            width: 18px;
            height: 18px;
            background: white;
            border: 3px solid var(--text-primary);
            border-radius: 50%;
            transform: translateX(-50%);
            transition: left 0.5s ease;
        }

        .bmi-info {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .info-section {
            margin-top: 2rem;
            padding: 1.5rem;
            background: var(--bg-secondary);
            border-radius: 16px;
        }

        .info-section h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .info-item {
            padding: 1rem;
            background: var(--glass-bg);
            border-radius: 12px;
            text-align: center;
        }

        .info-item .range {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }

        .info-item .label {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 2rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--accent-1);
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .tool-header h1 {
                font-size: 2rem;
            }

            .input-row {
                flex-direction: column;
                gap: 0;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="bg-shapes">
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>
    </div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span>AIO Tools Hub</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#tools">Tools</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <button class="theme-toggle" id="themeToggle">
                <div class="toggle-thumb"></div>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <div class="tool-container">
            <a href="index.html" class="back-link">← Back to Tools</a>

            <div class="tool-header">
                <div class="tool-icon">⚖️</div>
                <h1>BMI Calculator</h1>
                <p>Calculate your Body Mass Index and understand your weight category</p>
            </div>

            <div class="tool-card">
                <div class="input-group">
                    <label for="unit">Unit System</label>
                    <select id="unit" onchange="toggleUnits()">
                        <option value="metric">Metric (kg, cm)</option>
                        <option value="imperial">Imperial (lbs, inches)</option>
                    </select>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="weight" id="weightLabel">Weight (kg)</label>
                        <input type="number" id="weight" placeholder="70" min="1" max="500">
                    </div>
                    <div class="input-group">
                        <label for="height" id="heightLabel">Height (cm)</label>
                        <input type="number" id="height" placeholder="175" min="1" max="300">
                    </div>
                </div>

                <button class="btn" onclick="calculateBMI()">Calculate BMI</button>

                <div class="result-card" id="result">
                    <div class="bmi-value" id="bmiValue">0</div>
                    <div class="bmi-category" id="bmiCategory">Category</div>
                    <div class="bmi-bar">
                        <div class="bmi-indicator" id="bmiIndicator"></div>
                    </div>
                    <p class="bmi-info" id="bmiInfo"></p>
                </div>

                <div class="info-section">
                    <h3>📊 BMI Categories</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="range" style="color: var(--accent-2)">Below 18.5</div>
                            <div class="label">Underweight</div>
                        </div>
                        <div class="info-item">
                            <div class="range" style="color: var(--success)">18.5 - 24.9</div>
                            <div class="label">Normal Weight</div>
                        </div>
                        <div class="info-item">
                            <div class="range" style="color: var(--warning)">25.0 - 29.9</div>
                            <div class="label">Overweight</div>
                        </div>
                        <div class="info-item">
                            <div class="range" style="color: var(--danger)">30.0 and above</div>
                            <div class="label">Obese</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        function setTheme(theme) {
            document.documentElement.dataset.theme = theme;
            localStorage.setItem('theme', theme);
        }
        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.dataset.theme;
            setTheme(current === 'dark' ? 'light' : 'dark');
        });
        setTheme(localStorage.getItem('theme') || 'dark');

        // Toggle Units
        function toggleUnits() {
            const unit = document.getElementById('unit').value;
            const weightLabel = document.getElementById('weightLabel');
            const heightLabel = document.getElementById('heightLabel');

            if (unit === 'metric') {
                weightLabel.textContent = 'Weight (kg)';
                heightLabel.textContent = 'Height (cm)';
            } else {
                weightLabel.textContent = 'Weight (lbs)';
                heightLabel.textContent = 'Height (inches)';
            }
        }

        // Calculate BMI
        function calculateBMI() {
            const unit = document.getElementById('unit').value;
            let weight = parseFloat(document.getElementById('weight').value);
            let height = parseFloat(document.getElementById('height').value);

            if (!weight || !height || weight <= 0 || height <= 0) {
                alert('Please enter valid weight and height values.');
                return;
            }

            // Convert to metric if imperial
            if (unit === 'imperial') {
                weight = weight * 0.453592; // lbs to kg
                height = height * 2.54; // inches to cm
            }

            // Calculate BMI
            const heightM = height / 100;
            const bmi = weight / (heightM * heightM);

            // Display result
            document.getElementById('result').classList.add('show');
            document.getElementById('bmiValue').textContent = bmi.toFixed(1);

            // Determine category
            const categoryEl = document.getElementById('bmiCategory');
            const infoEl = document.getElementById('bmiInfo');
            const indicator = document.getElementById('bmiIndicator');

            categoryEl.className = 'bmi-category';

            let category, info, position;
            if (bmi < 18.5) {
                category = 'Underweight';
                categoryEl.classList.add('underweight');
                info = 'You are underweight. Consider consulting with a healthcare provider about healthy ways to gain weight through proper nutrition.';
                position = (bmi / 18.5) * 25;
            } else if (bmi < 25) {
                category = 'Normal Weight';
                categoryEl.classList.add('normal');
                info = 'Great! You have a healthy weight. Maintain it through balanced diet and regular physical activity.';
                position = 25 + ((bmi - 18.5) / 6.4) * 25;
            } else if (bmi < 30) {
                category = 'Overweight';
                categoryEl.classList.add('overweight');
                info = 'You are overweight. Consider adopting healthier eating habits and increasing physical activity.';
                position = 50 + ((bmi - 25) / 5) * 25;
            } else {
                category = 'Obese';
                categoryEl.classList.add('obese');
                info = 'You are in the obese category. Please consult with a healthcare provider for personalized advice on weight management.';
                position = 75 + Math.min(((bmi - 30) / 10) * 25, 25);
            }

            categoryEl.textContent = category;
            infoEl.textContent = info;
            indicator.style.left = `${Math.min(Math.max(position, 2), 98)}%`;
        }
    </script>
</body>

</html>
