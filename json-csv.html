<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to CSV - AIO Tools Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4ff, #e8e0ff, #fce4ff);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --bg-secondary: #fff;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0a0a1a, #1a1035, #0d1520);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #fff;
            --text-secondary: #b4b4d4;
            --nav-bg: rgba(10, 10, 26, 0.9);
            --bg-secondary: #12122a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        .main-content {
            padding: 100px 2rem 40px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            background: var(--accent-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }

        .tool-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
        }

        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .panel {
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .panel-title {
            font-weight: 600;
        }

        textarea {
            flex: 1;
            min-height: 300px;
            padding: 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 0.9rem;
            color: var(--text-primary);
            font-family: monospace;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .btn {
            padding: 12px 20px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
        }

        .convert-btn {
            width: 100%;
            margin-top: 1.5rem;
            padding: 16px;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .editor-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
        <button class="theme-toggle" id="themeToggle">
            <div class="toggle-thumb"></div>
        </button>
    </nav>
    <main class="main-content">
        <a href="index.html" class="back-link">← Back to Tools</a>
        <div class="tool-header">
            <div class="tool-icon">📋</div>
            <h1>JSON to CSV</h1>
            <p>Convert JSON data to CSV format</p>
        </div>
        <div class="tool-card">
            <div class="editor-grid">
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">📋 JSON Input</span>
                        <button class="btn btn-secondary" onclick="loadSample()">Sample</button>
                    </div>
                    <textarea id="jsonInput" placeholder="Paste your JSON here...">[
  {"name": "John", "age": 25, "city": "New York"},
  {"name": "Jane", "age": 30, "city": "Los Angeles"},
  {"name": "Bob", "age": 35, "city": "Chicago"}
]</textarea>
                </div>
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">📄 CSV Output</span>
                        <button class="btn btn-secondary" onclick="copyOutput()">Copy</button>
                    </div>
                    <textarea id="csvOutput" readonly placeholder="CSV will appear here..."></textarea>
                </div>
            </div>
            <button class="btn convert-btn" onclick="convert()">Convert to CSV →</button>
        </div>
    </main>
    <script>
        document.getElementById('themeToggle').onclick = () => {
            const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = t; localStorage.setItem('theme', t);
        };
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';

        function convert() {
            const json = document.getElementById('jsonInput').value.trim();
            if (!json) return;

            try {
                const data = JSON.parse(json);
                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error('Input must be an array of objects');
                }

                // Get all unique keys
                const headers = [...new Set(data.flatMap(obj => Object.keys(obj)))];

                // Build CSV
                let csv = headers.join(',') + '\n';
                data.forEach(obj => {
                    const row = headers.map(h => {
                        let val = obj[h] ?? '';
                        // Escape commas and quotes
                        if (String(val).includes(',') || String(val).includes('"')) {
                            val = '"' + String(val).replace(/"/g, '""') + '"';
                        }
                        return val;
                    });
                    csv += row.join(',') + '\n';
                });

                document.getElementById('csvOutput').value = csv.trim();
            } catch (e) {
                document.getElementById('csvOutput').value = 'Error: ' + e.message;
            }
        }

        function loadSample() {
            document.getElementById('jsonInput').value = `[
  {"name": "John Doe", "age": 25, "city": "New York", "email": "john@example.com"},
  {"name": "Jane Smith", "age": 30, "city": "Los Angeles", "email": "jane@example.com"},
  {"name": "Bob Johnson", "age": 35, "city": "Chicago", "email": "bob@example.com"},
  {"name": "Alice Brown", "age": 28, "city": "Seattle", "email": "alice@example.com"}
]`;
        }

        function copyOutput() {
            navigator.clipboard.writeText(document.getElementById('csvOutput').value);
            event.target.textContent = 'Copied!';
            setTimeout(() => event.target.textContent = 'Copy', 1500);
        }

        convert();
    </script>
</body>

</html>
