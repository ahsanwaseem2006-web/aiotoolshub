<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Base Converter - AIO Tools Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4ff, #e8e0ff, #fce4ff);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --bg-secondary: #fff;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0a0a1a, #1a1035, #0d1520);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #fff;
            --text-secondary: #b4b4d4;
            --nav-bg: rgba(10, 10, 26, 0.9);
            --bg-secondary: #12122a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        .main-content {
            padding: 100px 2rem 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            background: var(--accent-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }

        .tool-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .input-row {
            display: flex;
            gap: 1rem;
        }

        input,
        select {
            flex: 1;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: monospace;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .results {
            display: grid;
            gap: 1rem;
        }

        .result-item {
            background: var(--bg-secondary);
            border-radius: 14px;
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .result-value {
            font-family: monospace;
            font-size: 1.1rem;
            word-break: break-all;
            text-align: right;
            flex: 1;
            margin-left: 1rem;
        }

        .copy-btn {
            padding: 8px 14px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 0.85rem;
            margin-left: 0.75rem;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
        <button class="theme-toggle" id="themeToggle">
            <div class="toggle-thumb"></div>
        </button>
    </nav>
    <main class="main-content">
        <a href="index.html" class="back-link">← Back to Tools</a>
        <div class="tool-header">
            <div class="tool-icon">🔢</div>
            <h1>Number Base Converter</h1>
            <p>Convert between decimal, binary, hex, and octal</p>
        </div>
        <div class="tool-card">
            <div class="input-group">
                <label>Input Number</label>
                <div class="input-row">
                    <input type="text" id="inputNum" value="255" oninput="convert()">
                    <select id="inputBase" onchange="convert()">
                        <option value="10" selected>Decimal (10)</option>
                        <option value="2">Binary (2)</option>
                        <option value="8">Octal (8)</option>
                        <option value="16">Hex (16)</option>
                    </select>
                </div>
            </div>
            <div class="results">
                <div class="result-item">
                    <span class="result-label">Decimal (10)</span>
                    <span class="result-value" id="decimal">255</span>
                    <button class="copy-btn" onclick="copy('decimal')">Copy</button>
                </div>
                <div class="result-item">
                    <span class="result-label">Binary (2)</span>
                    <span class="result-value" id="binary">11111111</span>
                    <button class="copy-btn" onclick="copy('binary')">Copy</button>
                </div>
                <div class="result-item">
                    <span class="result-label">Octal (8)</span>
                    <span class="result-value" id="octal">377</span>
                    <button class="copy-btn" onclick="copy('octal')">Copy</button>
                </div>
                <div class="result-item">
                    <span class="result-label">Hexadecimal (16)</span>
                    <span class="result-value" id="hex">FF</span>
                    <button class="copy-btn" onclick="copy('hex')">Copy</button>
                </div>
            </div>
        </div>
    </main>
    <script>
        document.getElementById('themeToggle').onclick = () => {
            const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = t; localStorage.setItem('theme', t);
        };
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';

        function convert() {
            const input = document.getElementById('inputNum').value.trim();
            const base = parseInt(document.getElementById('inputBase').value);

            try {
                const decimal = parseInt(input, base);
                if (isNaN(decimal)) throw new Error('Invalid');

                document.getElementById('decimal').textContent = decimal.toString(10);
                document.getElementById('binary').textContent = decimal.toString(2);
                document.getElementById('octal').textContent = decimal.toString(8);
                document.getElementById('hex').textContent = decimal.toString(16).toUpperCase();
            } catch {
                document.getElementById('decimal').textContent = 'Invalid';
                document.getElementById('binary').textContent = 'Invalid';
                document.getElementById('octal').textContent = 'Invalid';
                document.getElementById('hex').textContent = 'Invalid';
            }
        }

        function copy(id) {
            navigator.clipboard.writeText(document.getElementById(id).textContent);
            event.target.textContent = '✓';
            setTimeout(() => event.target.textContent = 'Copy', 1000);
        }

        convert();
    </script>
</body>

</html>
