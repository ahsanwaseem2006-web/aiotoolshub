<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker - AIO Tools Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4ff, #e8e0ff, #fce4ff);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --bg-secondary: #fff;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0a0a1a, #1a1035, #0d1520);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #fff;
            --text-secondary: #b4b4d4;
            --nav-bg: rgba(10, 10, 26, 0.9);
            --bg-secondary: #12122a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        .main-content {
            padding: 100px 2rem 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            background: var(--accent-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }

        .tool-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
        }

        .color-preview {
            height: 150px;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            transition: background 0.3s;
        }

        .picker-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            align-items: center;
        }

        input[type="color"] {
            width: 80px;
            height: 60px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .color-value {
            flex: 1;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1.1rem;
            font-family: monospace;
            color: var(--text-primary);
        }

        .copy-btn {
            padding: 14px 20px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        .formats {
            display: grid;
            gap: 1rem;
        }

        .format-row {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .format-label {
            width: 60px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .format-value {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-radius: 10px;
            font-family: monospace;
        }

        .palette {
            margin-top: 1.5rem;
        }

        .palette h3 {
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .palette-colors {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .palette-color {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            border: 2px solid var(--glass-border);
        }

        .palette-color:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
        <button class="theme-toggle" id="themeToggle">
            <div class="toggle-thumb"></div>
        </button>
    </nav>
    <main class="main-content">
        <a href="index.html" class="back-link">← Back to Tools</a>
        <div class="tool-header">
            <div class="tool-icon">🎨</div>
            <h1>Color Picker</h1>
            <p>Pick colors and get HEX, RGB, HSL values</p>
        </div>
        <div class="tool-card">
            <div class="color-preview" id="preview" style="background: #7c3aed"></div>
            <div class="picker-row">
                <input type="color" id="picker" value="#7c3aed">
                <input type="text" class="color-value" id="hexInput" value="#7c3aed">
                <button class="copy-btn" onclick="copyColor()">Copy</button>
            </div>
            <div class="formats">
                <div class="format-row"><span class="format-label">HEX</span>
                    <div class="format-value" id="hex">#7c3aed</div>
                </div>
                <div class="format-row"><span class="format-label">RGB</span>
                    <div class="format-value" id="rgb">rgb(124, 58, 237)</div>
                </div>
                <div class="format-row"><span class="format-label">HSL</span>
                    <div class="format-value" id="hsl">hsl(262, 83%, 58%)</div>
                </div>
            </div>
            <div class="palette">
                <h3>Popular Colors</h3>
                <div class="palette-colors" id="palette"></div>
            </div>
        </div>
    </main>
    <script>
        document.getElementById('themeToggle').onclick = () => {
            const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = t;
            localStorage.setItem('theme', t);
        };
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';

        const picker = document.getElementById('picker');
        const hexInput = document.getElementById('hexInput');
        const preview = document.getElementById('preview');

        const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#14b8a6', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899', '#f43f5e', '#1a1a2e', '#ffffff'];
        document.getElementById('palette').innerHTML = colors.map(c => `<div class="palette-color" style="background:${c}" onclick="setColor('${c}')"></div>`).join('');

        function setColor(hex) {
            picker.value = hex;
            hexInput.value = hex;
            preview.style.background = hex;
            updateFormats(hex);
        }

        function updateFormats(hex) {
            document.getElementById('hex').textContent = hex.toUpperCase();
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            document.getElementById('rgb').textContent = `rgb(${r}, ${g}, ${b})`;
            // HSL calculation
            const rn = r / 255, gn = g / 255, bn = b / 255;
            const max = Math.max(rn, gn, bn), min = Math.min(rn, gn, bn);
            let h, s, l = (max + min) / 2;
            if (max === min) { h = s = 0; }
            else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case rn: h = ((gn - bn) / d + (gn < bn ? 6 : 0)) / 6; break;
                    case gn: h = ((bn - rn) / d + 2) / 6; break;
                    case bn: h = ((rn - gn) / d + 4) / 6; break;
                }
            }
            document.getElementById('hsl').textContent = `hsl(${Math.round(h * 360)}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%)`;
        }

        picker.oninput = () => setColor(picker.value);
        hexInput.oninput = () => { if (/^#[0-9a-f]{6}$/i.test(hexInput.value)) setColor(hexInput.value); };

        function copyColor() {
            navigator.clipboard.writeText(hexInput.value);
            event.target.textContent = 'Copied!';
            setTimeout(() => event.target.textContent = 'Copy', 1500);
        }

        updateFormats('#7c3aed');
    </script>
</body>

</html>
