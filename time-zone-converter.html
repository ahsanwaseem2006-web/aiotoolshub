<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Zone Converter - AIO Tools Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="description" content="Free Time Zone Converter - Convert time between different time zones worldwide.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script defer data-domain="aiotoolshub.com" src="https://plausible.io/js/script.js"></script>
    <style>
        :root {
            --bg-primary: #f0f4ff;
            --bg-secondary: #ffffff;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e8e0ff 50%, #fce4ff 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #7a7a9a;
            --accent-1: #7c3aed;
            --accent-2: #06b6d4;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
        }

        [data-theme="dark"] {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-gradient: linear-gradient(135deg, #0a0a1a 0%, #1a1035 50%, #0d1520 100%);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #b4b4d4;
            --text-muted: #7a7a9a;
            --accent-1: #a78bfa;
            --accent-2: #22d3ee;
            --accent-gradient: linear-gradient(135deg, #a78bfa, #22d3ee);
            --nav-bg: rgba(10, 10, 26, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
        }

        .bg-shape:nth-child(1) {
            width: 600px;
            height: 600px;
            background: var(--accent-1);
            top: -200px;
            right: -200px;
        }

        .bg-shape:nth-child(2) {
            width: 500px;
            height: 500px;
            background: var(--accent-2);
            bottom: -150px;
            left: -150px;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
            color: inherit;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-thumb::before {
            content: '🌙';
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 14px;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        [data-theme="light"] .toggle-thumb::before {
            content: '☀️';
        }

        .main-content {
            padding: 120px 2rem 60px;
            position: relative;
            z-index: 1;
        }

        .tool-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 2rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 80px;
            height: 80px;
            background: var(--accent-gradient);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
        }

        .tool-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
        }

        .current-time {
            text-align: center;
            padding: 1.5rem;
            background: var(--bg-secondary);
            border-radius: 16px;
            margin-bottom: 2rem;
        }

        .current-time .label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .current-time .time {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .current-time .date {
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .converter-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .timezone-input {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .timezone-input label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
        }

        .input-row {
            display: flex;
            gap: 1rem;
        }

        input,
        select {
            flex: 1;
            padding: 14px 18px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: inherit;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-1);
        }

        .result-box {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
        }

        .result-box .converted-time {
            font-size: 3rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .result-box .converted-date {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .result-box .timezone-name {
            color: var(--text-muted);
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .popular-zones {
            margin-top: 2rem;
        }

        .popular-zones h3 {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        .zones-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .zone-card {
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: 12px;
            text-align: center;
        }

        .zone-card .city {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .zone-card .zone-time {
            font-size: 1.25rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (max-width: 768px) {
            .tool-header h1 {
                font-size: 2rem;
            }

            .input-row {
                flex-direction: column;
            }

            .current-time .time {
                font-size: 2rem;
            }

            .result-box .converted-time {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="bg-shapes">
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>
    </div>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
            <button class="theme-toggle" id="themeToggle">
                <div class="toggle-thumb"></div>
            </button>
        </div>
    </nav>
    <main class="main-content">
        <div class="tool-container">
            <a href="index.html" class="back-link">← Back to Tools</a>
            <div class="tool-header">
                <div class="tool-icon">🌍</div>
                <h1>Time Zone Converter</h1>
                <p>Convert time between different time zones worldwide</p>
            </div>
            <div class="tool-card">
                <div class="current-time">
                    <div class="label">Your Local Time</div>
                    <div class="time" id="localTime">--:--:--</div>
                    <div class="date" id="localDate">---</div>
                </div>
                <div class="converter-section">
                    <div class="timezone-input">
                        <label>From</label>
                        <div class="input-row">
                            <input type="time" id="inputTime" value="12:00">
                            <input type="date" id="inputDate">
                            <select id="fromZone" onchange="convertTime()"></select>
                        </div>
                    </div>
                    <div class="timezone-input">
                        <label>To</label>
                        <select id="toZone" onchange="convertTime()"></select>
                    </div>
                    <div class="result-box">
                        <div class="converted-time" id="convertedTime">--:--</div>
                        <div class="converted-date" id="convertedDate">---</div>
                        <div class="timezone-name" id="timezoneName">Select timezones</div>
                    </div>
                </div>
                <div class="popular-zones">
                    <h3>🌎 World Clocks</h3>
                    <div class="zones-grid" id="worldClocks"></div>
                </div>
            </div>
        </div>
    </main>
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const setTheme = t => { document.documentElement.dataset.theme = t; localStorage.setItem('theme', t); };
        themeToggle.onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
        setTheme(localStorage.getItem('theme') || 'dark');

        const timezones = [
            { name: 'UTC', offset: 0, label: 'UTC (Coordinated Universal Time)' },
            { name: 'America/New_York', offset: -5, label: 'New York (EST/EDT)' },
            { name: 'America/Los_Angeles', offset: -8, label: 'Los Angeles (PST/PDT)' },
            { name: 'America/Chicago', offset: -6, label: 'Chicago (CST/CDT)' },
            { name: 'Europe/London', offset: 0, label: 'London (GMT/BST)' },
            { name: 'Europe/Paris', offset: 1, label: 'Paris (CET/CEST)' },
            { name: 'Europe/Berlin', offset: 1, label: 'Berlin (CET/CEST)' },
            { name: 'Asia/Dubai', offset: 4, label: 'Dubai (GST)' },
            { name: 'Asia/Kolkata', offset: 5.5, label: 'Mumbai (IST)' },
            { name: 'Asia/Singapore', offset: 8, label: 'Singapore (SGT)' },
            { name: 'Asia/Tokyo', offset: 9, label: 'Tokyo (JST)' },
            { name: 'Asia/Shanghai', offset: 8, label: 'Shanghai (CST)' },
            { name: 'Australia/Sydney', offset: 11, label: 'Sydney (AEST/AEDT)' },
            { name: 'Pacific/Auckland', offset: 13, label: 'Auckland (NZST/NZDT)' }
        ];

        const popularCities = ['New York', 'London', 'Tokyo', 'Sydney', 'Dubai', 'Singapore'];

        function initSelects() {
            const fromSelect = document.getElementById('fromZone');
            const toSelect = document.getElementById('toZone');
            const options = timezones.map(tz => `<option value="${tz.name}">${tz.label}</option>`).join('');
            fromSelect.innerHTML = options;
            toSelect.innerHTML = options;
            toSelect.value = 'America/New_York';

            // Set current date
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('inputDate').value = today;
        }

        function updateLocalTime() {
            const now = new Date();
            document.getElementById('localTime').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('localDate').textContent = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        function convertTime() {
            const time = document.getElementById('inputTime').value;
            const date = document.getElementById('inputDate').value;
            const from = document.getElementById('fromZone').value;
            const to = document.getElementById('toZone').value;

            if (!time || !date) return;

            try {
                const dateTime = new Date(`${date}T${time}:00`);
                const options = { timeZone: to, hour: '2-digit', minute: '2-digit', hour12: true };
                const dateOptions = { timeZone: to, weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };

                document.getElementById('convertedTime').textContent = dateTime.toLocaleTimeString('en-US', options);
                document.getElementById('convertedDate').textContent = dateTime.toLocaleDateString('en-US', dateOptions);
                document.getElementById('timezoneName').textContent = timezones.find(tz => tz.name === to)?.label || to;
            } catch (e) {
                document.getElementById('convertedTime').textContent = time;
            }
        }

        function updateWorldClocks() {
            const container = document.getElementById('worldClocks');
            const cities = [
                { city: 'New York', tz: 'America/New_York' },
                { city: 'London', tz: 'Europe/London' },
                { city: 'Tokyo', tz: 'Asia/Tokyo' },
                { city: 'Sydney', tz: 'Australia/Sydney' },
                { city: 'Dubai', tz: 'Asia/Dubai' },
                { city: 'Singapore', tz: 'Asia/Singapore' }
            ];

            container.innerHTML = cities.map(c => {
                const time = new Date().toLocaleTimeString('en-US', { timeZone: c.tz, hour: '2-digit', minute: '2-digit' });
                return `<div class="zone-card"><div class="city">${c.city}</div><div class="zone-time">${time}</div></div>`;
            }).join('');
        }

        // Event listeners
        document.getElementById('inputTime').onchange = convertTime;
        document.getElementById('inputDate').onchange = convertTime;

        // Initialize
        initSelects();
        updateLocalTime();
        updateWorldClocks();
        convertTime();

        // Update every second
        setInterval(() => {
            updateLocalTime();
            updateWorldClocks();
        }, 1000);
    </script>
</body>

</html>
