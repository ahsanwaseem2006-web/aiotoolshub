<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter - AIO Tools Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4ff, #e8e0ff, #fce4ff);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --bg-secondary: #fff;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0a0a1a, #1a1035, #0d1520);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #fff;
            --text-secondary: #b4b4d4;
            --nav-bg: rgba(10, 10, 26, 0.9);
            --bg-secondary: #12122a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        .main-content {
            padding: 100px 2rem 40px;
            max-width: 550px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            background: var(--accent-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }

        .tool-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
        }

        .currency-box {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .currency-box label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }

        .currency-row {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .currency-row input {
            flex: 1;
            padding: 14px 18px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            font-family: inherit;
        }

        .currency-row input:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .currency-row select {
            padding: 14px 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: inherit;
            cursor: pointer;
        }

        .swap-btn {
            display: block;
            margin: 0 auto;
            width: 50px;
            height: 50px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            transition: transform 0.3s;
        }

        .swap-btn:hover {
            transform: rotate(180deg);
        }

        .result-box {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            margin-top: 1.5rem;
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .result-rate {
            color: var(--text-secondary);
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        .note {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(124, 58, 237, 0.1);
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
        <button class="theme-toggle" id="themeToggle">
            <div class="toggle-thumb"></div>
        </button>
    </nav>
    <main class="main-content">
        <a href="index.html" class="back-link">← Back to Tools</a>
        <div class="tool-header">
            <div class="tool-icon">💱</div>
            <h1>Currency Converter</h1>
            <p>Convert between world currencies</p>
        </div>
        <div class="tool-card">
            <div class="currency-box">
                <label>From</label>
                <div class="currency-row">
                    <input type="number" id="amount" value="100" oninput="convert()">
                    <select id="fromCurrency" onchange="convert()"></select>
                </div>
            </div>
            <button class="swap-btn" onclick="swapCurrencies()">⇅</button>
            <div class="currency-box">
                <label>To</label>
                <div class="currency-row">
                    <select id="toCurrency" onchange="convert()"></select>
                </div>
            </div>
            <div class="result-box">
                <div class="result-value" id="result">0.00</div>
                <div class="result-rate" id="rate">1 USD = 1 EUR</div>
            </div>
            <div class="note">💡 Using approximate exchange rates for demonstration</div>
        </div>
    </main>
    <script>
        document.getElementById('themeToggle').onclick = () => {
            const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = t; localStorage.setItem('theme', t);
        };
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';

        // Sample exchange rates (USD base)
        const rates = {
            USD: { name: 'US Dollar', symbol: '$', rate: 1 },
            EUR: { name: 'Euro', symbol: '€', rate: 0.92 },
            GBP: { name: 'British Pound', symbol: '£', rate: 0.79 },
            JPY: { name: 'Japanese Yen', symbol: '¥', rate: 149.50 },
            CAD: { name: 'Canadian Dollar', symbol: 'C$', rate: 1.36 },
            AUD: { name: 'Australian Dollar', symbol: 'A$', rate: 1.53 },
            CHF: { name: 'Swiss Franc', symbol: 'Fr', rate: 0.88 },
            CNY: { name: 'Chinese Yuan', symbol: '¥', rate: 7.24 },
            INR: { name: 'Indian Rupee', symbol: '₹', rate: 83.12 },
            MXN: { name: 'Mexican Peso', symbol: '$', rate: 17.15 },
            BRL: { name: 'Brazilian Real', symbol: 'R$', rate: 4.97 },
            KRW: { name: 'Korean Won', symbol: '₩', rate: 1318 },
            SGD: { name: 'Singapore Dollar', symbol: 'S$', rate: 1.34 },
            AED: { name: 'UAE Dirham', symbol: 'د.إ', rate: 3.67 },
            PKR: { name: 'Pakistani Rupee', symbol: '₨', rate: 278.50 }
        };

        function populateSelects() {
            const options = Object.entries(rates).map(([code, data]) =>
                `<option value="${code}">${code} - ${data.name}</option>`
            ).join('');
            document.getElementById('fromCurrency').innerHTML = options;
            document.getElementById('toCurrency').innerHTML = options;
            document.getElementById('toCurrency').value = 'EUR';
        }

        function convert() {
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const from = document.getElementById('fromCurrency').value;
            const to = document.getElementById('toCurrency').value;

            // Convert to USD first, then to target
            const inUsd = amount / rates[from].rate;
            const result = inUsd * rates[to].rate;

            const formatted = result.toLocaleString('en-US', {
                style: 'currency',
                currency: to,
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            document.getElementById('result').textContent = formatted;

            const rateValue = (rates[to].rate / rates[from].rate).toFixed(4);
            document.getElementById('rate').textContent = `1 ${from} = ${rateValue} ${to}`;
        }

        function swapCurrencies() {
            const from = document.getElementById('fromCurrency');
            const to = document.getElementById('toCurrency');
            [from.value, to.value] = [to.value, from.value];
            convert();
        }

        populateSelects();
        convert();
    </script>
</body>

</html>
