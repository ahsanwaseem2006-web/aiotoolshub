<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer - AIO Tools Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="description"
        content="Free Image Resizer - Resize images to any dimension instantly. Maintain quality while changing image sizes for social media, web, and more.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script defer data-domain="aiotoolshub.com" src="https://plausible.io/js/script.js"></script>
    <style>
        :root {
            --bg-primary: #f0f4ff;
            --bg-secondary: #ffffff;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e8e0ff 50%, #fce4ff 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #7a7a9a;
            --accent-1: #7c3aed;
            --accent-2: #06b6d4;
            --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
            --nav-bg: rgba(255, 255, 255, 0.8);
        }

        [data-theme="dark"] {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-gradient: linear-gradient(135deg, #0a0a1a 0%, #1a1035 50%, #0d1520 100%);
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #b4b4d4;
            --text-muted: #7a7a9a;
            --accent-1: #a78bfa;
            --accent-2: #22d3ee;
            --accent-gradient: linear-gradient(135deg, #a78bfa, #22d3ee);
            --nav-bg: rgba(10, 10, 26, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 20s ease-in-out infinite;
        }

        .bg-shape:nth-child(1) {
            width: 600px;
            height: 600px;
            background: var(--accent-1);
            top: -200px;
            right: -200px;
        }

        .bg-shape:nth-child(2) {
            width: 500px;
            height: 500px;
            background: var(--accent-2);
            bottom: -150px;
            left: -150px;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-20px, 20px);
            }
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
            color: inherit;
        }

        .nav-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-1);
        }

        .theme-toggle {
            width: 60px;
            height: 32px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
            transition: transform 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .toggle-thumb::before {
            content: '🌙';
        }

        [data-theme="light"] .toggle-thumb {
            transform: translateX(28px);
        }

        [data-theme="light"] .toggle-thumb::before {
            content: '☀️';
        }

        .main-content {
            padding: 120px 2rem 60px;
            position: relative;
            z-index: 1;
        }

        .tool-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 2rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--accent-1);
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .tool-icon {
            width: 80px;
            height: 80px;
            background: var(--accent-gradient);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
        }

        .tool-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .tool-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
        }

        .upload-zone {
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1.5rem;
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--accent-1);
            background: rgba(124, 58, 237, 0.05);
        }

        .upload-zone .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .upload-zone h3 {
            margin-bottom: 0.5rem;
        }

        .upload-zone p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        #fileInput {
            display: none;
        }

        .preview-container {
            display: none;
            margin-bottom: 1.5rem;
        }

        .preview-container.show {
            display: block;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            display: block;
            margin: 0 auto 1rem;
        }

        .image-info {
            display: flex;
            justify-content: center;
            gap: 2rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .controls {
            display: grid;
            gap: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-weight: 500;
        }

        .input-row {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }

        .input-row .input-group {
            flex: 1;
        }

        input,
        select {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-primary);
            font-family: inherit;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .checkbox-group input {
            width: auto;
        }

        .btn {
            padding: 16px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
        }

        .result-section {
            display: none;
            margin-top: 2rem;
            padding: 2rem;
            background: var(--bg-secondary);
            border-radius: 16px;
            text-align: center;
        }

        .result-section.show {
            display: block;
        }

        .result-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        .result-info {
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .tool-header h1 {
                font-size: 2rem;
            }

            .input-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="bg-shapes">
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>
    </div>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo"><span>AIO Tools Hub</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#tools">Tools</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
            <button class="theme-toggle" id="themeToggle">
                <div class="toggle-thumb"></div>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <div class="tool-container">
            <a href="index.html" class="back-link">← Back to Tools</a>
            <div class="tool-header">
                <div class="tool-icon">🖼️</div>
                <h1>Image Resizer</h1>
                <p>Resize your images to any dimension while maintaining quality</p>
            </div>
            <div class="tool-card">
                <div class="upload-zone" id="uploadZone">
                    <div class="icon">📁</div>
                    <h3>Drop your image here</h3>
                    <p>or click to browse (JPG, PNG, WEBP, GIF)</p>
                    <input type="file" id="fileInput" accept="image/*">
                </div>
                <div class="preview-container" id="previewContainer">
                    <img id="previewImage" class="preview-image" alt="Preview">
                    <div class="image-info">
                        <span id="originalSize">Original: 0 x 0</span>
                        <span id="fileSize">Size: 0 KB</span>
                    </div>
                </div>
                <div class="controls">
                    <div class="input-row">
                        <div class="input-group">
                            <label for="width">Width (px)</label>
                            <input type="number" id="width" placeholder="800" min="1" max="10000">
                        </div>
                        <div class="input-group">
                            <label for="height">Height (px)</label>
                            <input type="number" id="height" placeholder="600" min="1" max="10000">
                        </div>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="maintainRatio" checked>
                        <label for="maintainRatio">Maintain aspect ratio</label>
                    </div>
                    <div class="input-group">
                        <label for="format">Output Format</label>
                        <select id="format">
                            <option value="image/png">PNG</option>
                            <option value="image/jpeg">JPG</option>
                            <option value="image/webp">WEBP</option>
                        </select>
                    </div>
                    <button class="btn" id="resizeBtn" disabled>Resize Image</button>
                </div>
                <div class="result-section" id="resultSection">
                    <img id="resultImage" class="result-image" alt="Resized">
                    <div class="result-info" id="resultInfo">New size: 0 x 0</div>
                    <button class="btn download-btn" id="downloadBtn">⬇️ Download Image</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const setTheme = theme => { document.documentElement.dataset.theme = theme; localStorage.setItem('theme', theme); };
        themeToggle.onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
        setTheme(localStorage.getItem('theme') || 'dark');

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const widthInput = document.getElementById('width');
        const heightInput = document.getElementById('height');
        const maintainRatio = document.getElementById('maintainRatio');
        const resizeBtn = document.getElementById('resizeBtn');
        const resultSection = document.getElementById('resultSection');
        const resultImage = document.getElementById('resultImage');
        const downloadBtn = document.getElementById('downloadBtn');

        let originalImage = null;
        let aspectRatio = 1;

        uploadZone.onclick = () => fileInput.click();
        uploadZone.ondragover = e => { e.preventDefault(); uploadZone.classList.add('dragover'); };
        uploadZone.ondragleave = () => uploadZone.classList.remove('dragover');
        uploadZone.ondrop = e => { e.preventDefault(); uploadZone.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); };
        fileInput.onchange = e => handleFile(e.target.files[0]);

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    aspectRatio = img.width / img.height;
                    previewImage.src = e.target.result;
                    previewContainer.classList.add('show');
                    document.getElementById('originalSize').textContent = `Original: ${img.width} x ${img.height}`;
                    document.getElementById('fileSize').textContent = `Size: ${(file.size / 1024).toFixed(1)} KB`;
                    widthInput.value = img.width;
                    heightInput.value = img.height;
                    resizeBtn.disabled = false;
                    resultSection.classList.remove('show');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        widthInput.oninput = () => { if (maintainRatio.checked && originalImage) heightInput.value = Math.round(widthInput.value / aspectRatio); };
        heightInput.oninput = () => { if (maintainRatio.checked && originalImage) widthInput.value = Math.round(heightInput.value * aspectRatio); };

        resizeBtn.onclick = () => {
            if (!originalImage) return;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const newWidth = parseInt(widthInput.value) || originalImage.width;
            const newHeight = parseInt(heightInput.value) || originalImage.height;
            canvas.width = newWidth;
            canvas.height = newHeight;
            ctx.drawImage(originalImage, 0, 0, newWidth, newHeight);
            const format = document.getElementById('format').value;
            const dataUrl = canvas.toDataURL(format, 0.92);
            resultImage.src = dataUrl;
            document.getElementById('resultInfo').textContent = `New size: ${newWidth} x ${newHeight}`;
            resultSection.classList.add('show');
            downloadBtn.onclick = () => {
                const link = document.createElement('a');
                link.download = `resized-image.${format.split('/')[1]}`;
                link.href = dataUrl;
                link.click();
            };
        };
    </script>
</body>

</html>
